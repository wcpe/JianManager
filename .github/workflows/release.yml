# 发布管线（通用骨架 + 本仓构建命令，见 ADR-036）。
#
# 分支模型：单主干 GitHub Flow，主干唯一 master，一切变更经 PR 合入。
#
# 触发：
#   - push tag `v*`（如 v0.22.1） → 唯一发布动作：构建 + 建 GitHub Release。
#   - workflow_dispatch           → 手工重跑（须在正式 tag ref 上）。
#
# 刻意**不**监听主干 push，也不监听 pull_request：
#   metadata job 用 scripts/release-metadata.mjs 解析版本，该脚本要求「裸 X.Y.Z 版本必须存在
#   同 SHA 的 vX.Y.Z tag」。主干/开发分支上的源码是裸版本或 X.Y.Z-dev，两者都不满足，会直接
#   失败（实测：主干 push 时 metadata job 0s 报「普通分支源码使用裸版本 0.22.0，但当前提交没有
#   同 SHA tag v0.22.0」）；PR 的 ref 是 refs/pull/N/merge，同样解析不出合法版本。
#   故主干与 PR 的构建校验统一由 ci.yml 承担，本工作流只负责发版。
# 硬门禁：正式 tag 对应提交必须已在 origin/master 历史上（release-metadata.mjs 校验）。
#   禁止从 feature/* 等非主干 tip 直接打 tag 出正式版；顺序必须"先合 PR 到主干，后打 tag"，
#   否则该提交掉出 --generate-notes 的统计区间（只统计两 tag 间合并的 PR）。
#
# 版本号单一真源：internal/version/version.go（ADR-065）。metadata job 解析并校验 Git ref/tag，
#   正式 tag `vX.Y.Z` 注入裸 `X.Y.Z`，开发构建注入 `X.Y.Z-dev+g<7位sha>`；
#   后续 job 只消费同一份 metadata output，禁止各自拼版本。
#
# 产物：
#   - control-plane（full，内嵌双平台 Worker）/ control-plane-slim（不内嵌 Worker）
#   - worker × linux/amd64 + windows/amd64
#   共 6 个二进制 + checksums.txt；命名 `<component>[-slim]-<os>-<arch>[.exe]`（ADR-036 §1）。
#
# 内嵌：发布二进制内嵌全部可选资产——CP 内嵌前端 + Bot Worker + 客户端更新器两件套，
#   Worker 内嵌 CFR 反编译器（ADR-036 §5）。go:embed 缺目录即编译失败，故 prepare-embeds 必须
#   产出所有 embed 目录内容、任一步失败即 fail-fast。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.2'
  NODE_VERSION: '22'
  JAVA_VERSION: '21' # 客户端更新器以 --release 8 在 JDK21 上构 Java8 字节码（无独立 toolchain 下载）

jobs:
  # ───────────────────────── metadata：统一解析源码版本、Git ref 与发布目标 ─────────────────────────
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - name: Checkout（读取源码版本与当前提交 tag）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 确保可解析 origin/master（正式 tag 祖先校验）
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          git rev-parse --verify origin/master

      - name: 验证正式 tag 的 CI 触发契约
        shell: bash
        run: node --test scripts/release-metadata.test.mjs

      - name: 解析并校验发布元数据（正式 tag 须在 master 上）
        id: meta
        shell: bash
        run: node scripts/release-metadata.mjs

  # ───────────────────────── verify-ci：复用同提交 CI 门禁结果 ─────────────────────────
  verify-ci:
    needs: metadata
    if: needs.metadata.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read  # 查询同提交 CI 运行结果（gh run list / view）
      contents: read
    steps:
      - name: 等待同提交 CI 通过
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          run_id=""
          while [[ -z "${run_id}" && ${SECONDS} -lt ${deadline} ]]; do
            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${GITHUB_SHA}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -z "${run_id}" ]]; then
              echo "尚未找到同提交 CI，10 秒后重试"
              sleep 10
            fi
          done
          if [[ -z "${run_id}" ]]; then
            echo "等待同提交 CI 超时：${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "等待 CI run ${run_id} 完成"
          while [[ ${SECONDS} -lt ${deadline} ]]; do
            state="$(gh run view "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json status,conclusion \
              --jq '[.status, .conclusion] | @tsv')"
            IFS=$'\t' read -r status conclusion <<< "${state}"
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "同提交 CI 已通过"
                exit 0
              fi
              echo "同提交 CI 未通过：${conclusion}" >&2
              exit 1
            fi
            echo "CI 当前状态：${status}，15 秒后重查"
            sleep 15
          done
          echo "等待 CI 完成超时：${GITHUB_SHA}" >&2
          exit 1

  # ───────────────────────── prepare-embeds：一次性产出全部 go:embed 资产 ─────────────────────────
  # 内嵌资产平台无关（jar / 前端静态文件），只构建一次跨 matrix 复用。
  prepare-embeds:
    needs: [metadata, verify-ci]
    if: needs.metadata.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java（JDK21）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 缓存 Gradle（客户端更新器构建）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client-updater/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 缓存包管理器（pnpm store / bot-worker npm）
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.npm
          key: js-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/bot-worker/package-lock.json') }}
          restore-keys: |
            js-${{ runner.os }}-

      - name: Bot Worker 依赖与发布门禁 + 内嵌资产
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/bot-worker ci
          npm --prefix apps/bot-worker run audit:prod
          npm --prefix apps/bot-worker run typecheck
          npm --prefix apps/bot-worker run lint
          npm --prefix apps/bot-worker run build
          go run ./scripts/embed-botworker.go \
            --src apps/bot-worker/dist \
            --pkgjson apps/bot-worker/package.json \
            --out internal/controlplane/embed/botworker \
            --version "${{ needs.metadata.outputs.version }}"

      - name: 前端依赖与构建 + 许可清单（pnpm workspace）
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/gen-licenses.mjs
          pnpm --filter control-plane-web build
          mkdir -p internal/controlplane/embed/dist
          cp -r apps/control-plane-web/dist/* internal/controlplane/embed/dist/

      - name: 内嵌客户端更新器两件套（等价 make embed-client-updater）
        shell: bash
        run: |
          set -euo pipefail
          (cd client-updater && ./gradlew --no-daemon :wedge:jar :updater-core:jar)
          mkdir -p internal/controlplane/embed/client-updater
          cp client-updater/wedge/build/libs/wedge-*.jar internal/controlplane/embed/client-updater/wedge.jar || {
            echo "错误：客户端更新器楔子 jar 构建产物缺失" >&2
            exit 1
          }
          cp client-updater/updater-core/build/libs/updater-core-*.jar internal/controlplane/embed/client-updater/updater-core.jar || {
            echo "错误：客户端 updater-core jar 构建产物缺失" >&2
            exit 1
          }
          bash scripts/verify-client-updater-embed.sh \
            internal/controlplane/embed/client-updater/wedge.jar \
            internal/controlplane/embed/client-updater/updater-core.jar

      - name: 内嵌 CFR 反编译器（等价 make embed-cfr，sha256 pin 校验）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal/worker/embed/cfr
          curl -fsSL -o internal/worker/embed/cfr/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          echo "f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2  internal/worker/embed/cfr/cfr.jar" | sha256sum -c -

      - name: 上传 CP embed 产物（dist + client-updater + botworker）
        uses: actions/upload-artifact@v7
        with:
          name: embed-controlplane
          path: |
            internal/controlplane/embed/dist/
            internal/controlplane/embed/client-updater/
            internal/controlplane/embed/botworker/
          retention-days: 1
          include-hidden-files: true # 保留各目录 .gitignore 占位，避免空目录被丢弃

      - name: 上传 Worker embed 产物（cfr）
        uses: actions/upload-artifact@v7
        with:
          name: embed-worker
          path: internal/worker/embed/cfr/
          retention-days: 1
          include-hidden-files: true

  # ───────────────────────── go-test：Go 编译/静态检查/单测（发布前门禁） ─────────────────────────
  # 前端与 Bot 门禁复用同提交 CI；此处只验证依赖完整 embed 的 Go 代码。
  go-test:
    needs: prepare-embeds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout（不需子模块源，只需下载的 embed 产物）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 还原 CP embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-controlplane
          path: internal/controlplane/embed/

      - name: 还原 Worker embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-worker
          path: internal/worker/embed/cfr/

      - name: Go 构建 / vet / 测试
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...

  # ───────────────────────── build：交叉编译 4 个二进制（matrix） ─────────────────────────
  build:
    needs: [metadata, prepare-embeds, go-test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, ext: '' }
          - { os: windows, arch: amd64, ext: '.exe' }
    steps:
      - name: Checkout（不需子模块源，只需下载的 embed 产物）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 还原 CP embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-controlplane
          path: internal/controlplane/embed/

      - name: 还原 Worker embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-worker
          path: internal/worker/embed/cfr/

      - name: 注入 CP 内嵌 Worker 资产（两平台 + manifest，full 档）
        shell: bash
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/wcpe/JianManager/internal/version.Version=${VERSION}"
          mkdir -p internal/controlplane/embed/worker
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" \
            -o internal/controlplane/embed/worker/worker-windows-amd64.exe ./apps/worker
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" \
            -o internal/controlplane/embed/worker/worker-linux-amd64 ./apps/worker
          go run ./scripts/embed-worker-manifest.go --dir internal/controlplane/embed/worker --version "${VERSION}"

      - name: 交叉编译 control-plane（full）与 worker
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/wcpe/JianManager/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/control-plane-${GOOS}-${GOARCH}${{ matrix.ext }}" ./apps/control-plane
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/worker-${GOOS}-${GOARCH}${{ matrix.ext }}" ./apps/worker
          ls -l dist/

      - name: 交叉编译 control-plane-slim（清除 Worker 内嵌后重编）
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # 仅删内嵌 Worker 字节，保留 .gitignore；前端/botworker/客户端更新器仍在
          find internal/controlplane/embed/worker -type f ! -name '.gitignore' -delete
          LDFLAGS="-s -w -X github.com/wcpe/JianManager/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/control-plane-slim-${GOOS}-${GOARCH}${{ matrix.ext }}" ./apps/control-plane
          ls -l dist/

      - name: 上传二进制产物（供 smoke 校验，retention 1 天）
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  # ───────────────────────── smoke：原生执行四个发布二进制并核对版本 ─────────────────────────
  smoke:
    needs: [metadata, build]
    if: needs.metadata.outputs.publish_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, artifact: binaries-linux-amd64, binary: control-plane-linux-amd64 }
          - { runner: ubuntu-24.04, artifact: binaries-linux-amd64, binary: control-plane-slim-linux-amd64 }
          - { runner: ubuntu-24.04, artifact: binaries-linux-amd64, binary: worker-linux-amd64 }
          - { runner: windows-latest, artifact: binaries-windows-amd64, binary: control-plane-windows-amd64.exe }
          - { runner: windows-latest, artifact: binaries-windows-amd64, binary: control-plane-slim-windows-amd64.exe }
          - { runner: windows-latest, artifact: binaries-windows-amd64, binary: worker-windows-amd64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 下载待验二进制
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Linux 版本烟测
        if: runner.os == 'Linux'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x "dist/${BINARY}"
          actual="$("./dist/${BINARY}" --version 2>version-stderr.txt)"
          test ! -s version-stderr.txt
          [[ "${actual}" == "${EXPECTED_VERSION}" ]]

      - name: Windows 版本烟测
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $actual = (& "./dist/$env:BINARY" --version 2> version-stderr.txt | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "二进制退出码异常：$LASTEXITCODE" }
          if ((Get-Item version-stderr.txt).Length -ne 0) { throw "二进制向 stderr 输出了内容" }
          if ($actual -ne $env:EXPECTED_VERSION) { throw "版本不一致：实际 $actual，期望 $env:EXPECTED_VERSION" }

  # ───────────────────────── release：汇总 + checksums + 发布（唯一发布动作） ─────────────────────────
  # 说明用 gh release create --generate-notes 自动生成，只统计两 tag 之间合并的 PR——
  # 直推主干的提交不进说明，这正是本仓强制一切变更走 PR 的直接原因。
  release:
    needs: [metadata, build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载全部二进制产物到 dist/
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: 生成 checksums.txt（每件 sha256，ADR-036 §2）
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: 创建或覆盖 GitHub Release（generate-notes）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "${TAG_NAME}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
