# 发布管线（FR-173，见 ADR-036）。
#
# 触发：
#   - push 到 master              → 滚动预发布：覆盖固定 tag `latest`（prerelease，FR-182），说明取 CHANGELOG [Unreleased]。
#   - push tag `v*`（如 v0.11.0）  → 正式发布：建 release `vX.Y.Z`（非 prerelease），说明取该版本段。
# 硬门禁：正式 tag 对应提交必须已在 origin/master 历史上（release-metadata.mjs 校验）。
#   禁止从 feature/release/* 等非主干 tip 直接打 tag 出正式版。
#
# 产物：
#   - control-plane（full，内嵌双平台 Worker）/ control-plane-slim（不内嵌 Worker，探针仍内嵌）
#   - worker × linux/amd64 + windows/amd64
#   共 6 个二进制 + checksums.txt；命名 `<component>[-slim]-<os>-<arch>[.exe]`（ADR-036 §1 扩展 slim 档）。
#
# 内嵌：发布二进制内嵌全部可选资产——CP 内嵌前端 + Bot Worker + 探针 jar + 客户端更新器两件套，
# Worker 内嵌 CFR 反编译器（ADR-036 §5）。go:embed 缺目录即编译失败，故 prepare-embeds 必须
# 产出所有 embed 目录内容、任一步失败即 fail-fast。
#
# 版本注入：metadata job 读取 internal/version.Version 并校验 Git ref/tag；正式 tag `vX.Y.Z` 注入裸 `X.Y.Z`，
# 开发构建沿用源码 `X.Y.Z-dev` 并附加 `+g<shortsha>`。后续 job 只消费同一份 metadata output。

name: release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  actions: read # 查询同提交 CI 结果，避免发布工作流重复跑前端测试
  contents: write # 发 release / 管 tag 需写权限（ADR-036 后果）

concurrency:
  # latest（master）滚动覆盖：同组取消在途，避免并发覆盖打架。tag 发布各自独立成组。
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.2'
  NODE_VERSION: '22'
  JAVA_VERSION: '21' # 探针需 JDK21；客户端更新器以 --release 8 在 JDK21 上构 Java8 字节码（无独立 toolchain 下载）

jobs:
  # ───────────────────────── metadata：统一解析源码版本、Git ref 与发布目标 ─────────────────────────
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - name: Checkout（读取源码版本与当前提交 tag）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 确保可解析 origin/master（正式 tag 祖先校验）
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          git rev-parse --verify origin/master

      - name: 解析并校验发布元数据（正式 tag 须在 master 上）
        id: meta
        shell: bash
        run: node scripts/release-metadata.mjs

  # ───────────────────────── verify-ci：复用同提交 CI 门禁结果 ─────────────────────────
  verify-ci:
    needs: metadata
    if: needs.metadata.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 等待同提交 CI 通过
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          run_id=""
          while [[ -z "${run_id}" && ${SECONDS} -lt ${deadline} ]]; do
            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${GITHUB_SHA}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -z "${run_id}" ]]; then
              echo "尚未找到同提交 CI，10 秒后重试"
              sleep 10
            fi
          done
          if [[ -z "${run_id}" ]]; then
            echo "等待同提交 CI 超时：${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "等待 CI run ${run_id} 完成"
          while [[ ${SECONDS} -lt ${deadline} ]]; do
            state="$(gh run view "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json status,conclusion \
              --jq '[.status, .conclusion] | @tsv')"
            IFS=$'\t' read -r status conclusion <<< "${state}"
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "同提交 CI 已通过"
                exit 0
              fi
              echo "同提交 CI 未通过：${conclusion}" >&2
              exit 1
            fi
            echo "CI 当前状态：${status}，15 秒后重查"
            sleep 15
          done
          echo "等待 CI 完成超时：${GITHUB_SHA}" >&2
          exit 1

  # ───────────────────────── prepare-embeds：一次性产出全部 go:embed 资产 ─────────────────────────
  # 内嵌资产平台无关（jar / 前端静态文件），只构建一次跨 matrix 复用。
  prepare-embeds:
    needs: [metadata, verify-ci]
    if: needs.metadata.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含子模块，embed-probe 需 third_party/ServerProbe）
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java（JDK21）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 缓存 Gradle（探针 / 客户端更新器构建）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client-updater/**/*.gradle*', 'third_party/ServerProbe/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 缓存包管理器（pnpm store / bot-worker npm）
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.npm
          key: js-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/bot-worker/package-lock.json') }}
          restore-keys: |
            js-${{ runner.os }}-

      - name: Bot Worker 依赖与发布门禁 + 内嵌资产
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/bot-worker ci
          npm --prefix apps/bot-worker run audit:prod
          npm --prefix apps/bot-worker run typecheck
          npm --prefix apps/bot-worker run lint
          npm --prefix apps/bot-worker run build
          go run ./scripts/embed-botworker.go \
            --src apps/bot-worker/dist \
            --pkgjson apps/bot-worker/package.json \
            --out internal/controlplane/embed/botworker \
            --version "${{ needs.metadata.outputs.version }}"

      - name: 前端依赖与构建 + 许可清单（pnpm workspace）
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/gen-licenses.mjs
          pnpm --filter control-plane-web build
          mkdir -p internal/controlplane/embed/dist
          cp -r apps/control-plane-web/dist/* internal/controlplane/embed/dist/

      - name: 内嵌探针 jar 与离线依赖缓存（等价 make embed-probe）
        shell: bash
        run: |
          set -euo pipefail
          (cd third_party/ServerProbe && ./gradlew --no-daemon :plugin:jar :plugin:taboolibMainTask)
          mkdir -p internal/controlplane/embed/probe
          cp third_party/ServerProbe/plugin/build/libs/ServerProbe-*.jar internal/controlplane/embed/probe/ServerProbe.jar
          go run ./scripts/probe-offline-cache.go --probe-jar internal/controlplane/embed/probe/ServerProbe.jar --output-zip internal/controlplane/embed/probe/probe-libraries.zip --output-info internal/controlplane/embed/probe/probe.json

      - name: 内嵌客户端更新器两件套（等价 make embed-client-updater）
        shell: bash
        run: |
          set -euo pipefail
          (cd client-updater && ./gradlew --no-daemon :wedge:jar :updater-core:jar)
          mkdir -p internal/controlplane/embed/client-updater
          cp client-updater/wedge/build/libs/wedge-*.jar internal/controlplane/embed/client-updater/wedge.jar || {
            echo "错误：客户端更新器楔子 jar 构建产物缺失" >&2
            exit 1
          }
          cp client-updater/updater-core/build/libs/updater-core-*.jar internal/controlplane/embed/client-updater/updater-core.jar || {
            echo "错误：客户端 updater-core jar 构建产物缺失" >&2
            exit 1
          }
          bash scripts/verify-client-updater-embed.sh \
            internal/controlplane/embed/client-updater/wedge.jar \
            internal/controlplane/embed/client-updater/updater-core.jar

      - name: 内嵌 CFR 反编译器（等价 make embed-cfr，sha256 pin 校验）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal/worker/embed/cfr
          curl -fsSL -o internal/worker/embed/cfr/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          echo "f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2  internal/worker/embed/cfr/cfr.jar" | sha256sum -c -

      - name: 上传 CP embed 产物（dist + probe + client-updater + botworker）
        uses: actions/upload-artifact@v7
        with:
          name: embed-controlplane
          path: |
            internal/controlplane/embed/dist/
            internal/controlplane/embed/probe/
            internal/controlplane/embed/client-updater/
            internal/controlplane/embed/botworker/
          retention-days: 1
          include-hidden-files: true # 保留各目录 .gitignore 占位，避免空目录被丢弃

      - name: 上传 Worker embed 产物（cfr）
        uses: actions/upload-artifact@v7
        with:
          name: embed-worker
          path: internal/worker/embed/cfr/
          retention-days: 1
          include-hidden-files: true

  # ───────────────────────── go-test：Go 编译/静态检查/单测（发布前门禁） ─────────────────────────
  # 前端与 Bot 门禁复用同提交 CI；此处只验证依赖完整 embed 的 Go 代码。
  go-test:
    needs: prepare-embeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（不需子模块源，只需下载的 embed 产物）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 还原 CP embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-controlplane
          path: internal/controlplane/embed/

      - name: 还原 Worker embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-worker
          path: internal/worker/embed/cfr/

      - name: Go 构建 / vet / 测试
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...

  # ───────────────────────── build：交叉编译 4 个二进制（matrix） ─────────────────────────
  build:
    needs: [metadata, prepare-embeds, go-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, ext: '' }
          - { os: windows, arch: amd64, ext: '.exe' }
    steps:
      - name: Checkout（不需子模块源，只需下载的 embed 产物）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 还原 CP embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-controlplane
          path: internal/controlplane/embed/

      - name: 还原 Worker embed 产物
        uses: actions/download-artifact@v8
        with:
          name: embed-worker
          path: internal/worker/embed/cfr/

      - name: 注入 CP 内嵌 Worker 资产（两平台 + manifest，full 档）
        shell: bash
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/wcpe/JianManager/internal/version.Version=${VERSION}"
          mkdir -p internal/controlplane/embed/worker
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" \
            -o internal/controlplane/embed/worker/worker-windows-amd64.exe ./apps/worker
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" \
            -o internal/controlplane/embed/worker/worker-linux-amd64 ./apps/worker
          go run ./scripts/embed-worker-manifest.go --dir internal/controlplane/embed/worker --version "${VERSION}"

      - name: 交叉编译 control-plane（full）与 worker
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/wcpe/JianManager/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/control-plane-${GOOS}-${GOARCH}${{ matrix.ext }}" ./apps/control-plane
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/worker-${GOOS}-${GOARCH}${{ matrix.ext }}" ./apps/worker
          ls -l dist/

      - name: 交叉编译 control-plane-slim（清除 Worker 内嵌后重编）
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # 仅删内嵌 Worker 字节，保留 .gitignore；探针/前端/botworker 仍在
          find internal/controlplane/embed/worker -type f ! -name '.gitignore' -delete
          LDFLAGS="-s -w -X github.com/wcpe/JianManager/internal/version.Version=${VERSION}"
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/control-plane-slim-${GOOS}-${GOARCH}${{ matrix.ext }}" ./apps/control-plane
          ls -l dist/

      - name: 上传二进制产物
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  # ───────────────────────── smoke：原生执行四个发布二进制并核对版本 ─────────────────────────
  smoke:
    needs: [metadata, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, artifact: binaries-linux-amd64, binary: control-plane-linux-amd64 }
          - { runner: ubuntu-latest, artifact: binaries-linux-amd64, binary: control-plane-slim-linux-amd64 }
          - { runner: ubuntu-latest, artifact: binaries-linux-amd64, binary: worker-linux-amd64 }
          - { runner: windows-latest, artifact: binaries-windows-amd64, binary: control-plane-windows-amd64.exe }
          - { runner: windows-latest, artifact: binaries-windows-amd64, binary: control-plane-slim-windows-amd64.exe }
          - { runner: windows-latest, artifact: binaries-windows-amd64, binary: worker-windows-amd64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 下载待验二进制
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Linux 版本烟测
        if: runner.os == 'Linux'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x "dist/${BINARY}"
          actual="$("./dist/${BINARY}" --version 2>version-stderr.txt)"
          test ! -s version-stderr.txt
          [[ "${actual}" == "${EXPECTED_VERSION}" ]]

      - name: Windows 版本烟测
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $actual = (& "./dist/$env:BINARY" --version 2> version-stderr.txt | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "二进制退出码异常：$LASTEXITCODE" }
          if ((Get-Item version-stderr.txt).Length -ne 0) { throw "二进制向 stderr 输出了内容" }
          if ($actual -ne $env:EXPECTED_VERSION) { throw "版本不一致：实际 $actual，期望 $env:EXPECTED_VERSION" }

  # ───────────────────────── release：汇总 + checksums + 发布 ─────────────────────────
  release:
    needs: [metadata, build, smoke]
    if: needs.metadata.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（取 CHANGELOG + 提取脚本）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node（跑 changelog-extract）
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载全部二进制产物到 dist/
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: 生成 checksums.txt（每件 sha256，ADR-036 §2）
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: 提取发布说明（CHANGELOG 段落）
        id: notes
        shell: bash
        env:
          IS_RELEASE: ${{ needs.metadata.outputs.is_release }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${IS_RELEASE}" == "true" ]]; then
            node scripts/changelog-extract.mjs --version "${VERSION}" > release-notes.md
          else
            node scripts/changelog-extract.mjs --unreleased > release-notes.md
          fi
          echo "提取的发布说明："
          cat release-notes.md

      - name: 清空既有 latest 资产（仅预发布，确保只保留本次产物）
        if: needs.metadata.outputs.is_release == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 删除既有 latest release（容忍不存在），随后由发布步骤以本次产物重建，杜绝旧资产残留（FR-182：tag 由 nightly 改名 latest）。
          gh release delete latest --cleanup-tag --yes 2>/dev/null || echo "无既有 latest release，跳过删除"

      - name: 发布正式 release（tag vX.Y.Z）
        if: needs.metadata.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: ${{ needs.metadata.outputs.release_tag }}
          body_path: release-notes.md
          prerelease: false
          files: dist/*

      - name: 发布滚动预发布（latest）
        if: needs.metadata.outputs.is_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body_path: release-notes.md
          prerelease: true
          files: dist/*
