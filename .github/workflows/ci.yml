# 前端与 bot-worker 质量门禁（见 ADR-047 决策 8 / spec §9）。
#
# 触发：pull_request + 主干 master push + 正式 v* tag。
#   单主干模型下不再对任意分支 push 跑门禁——短分支（feature/fix/refactor/hotfix/docs/chore）
#   的门禁由 pull_request 承担，master 上的门禁用于确认主干始终可发布。
#   正式 tag 产生与发布提交相同 SHA 的 CI，release.yml 复用其结果，不重复执行前端质量门禁。
#
# 闸：前端 workspace 的 lint（tsc + eslint）+ vitest（node 项目 / dom 项目 / devmock 包自检分处三个 job 并行）+ build，
#   Playwright E2E 按文件分成四个独立 runner 并行执行；任一失败 → web-quality 失败 → check 红。
#   仓库**分支保护**勾选 `web-quality` 为必需 check 即合并前硬挡
#   （分支保护是仓库设置，CI 只提供 check；见 README.md「前端 mock 模式与测试」）。
#
# E2E 不再用重试兜底（2026-10-20 用户裁定）：`playwright.config.ts` 已设
#   `retries: 0` + `failOnFlakyTests: true`，任何一次失败都让门禁红。
#   原配置是重试一次、恢复后仍算通过，把时序竞态藏了起来（表现为「不同用例轮流 flaky、
#   重跑就绿」）。真正的根因是断言默认超时 5s 太短——全仓 93 处用例都经 helpers.login()
#   等首屏，本地实测 7s 级、4 分片并行下再翻倍 ⇒ 必然偶发。现统一为 expect 15s / 用例 60s，
#   并收敛了 56 处逐处打补丁的 timeout。若日后又出现裸的 `timeout: 15_000` 补丁，
#   说明基准被改坏了，应回头查配置而不是再贴补丁。
#
# 路径与命令对齐 monorepo 真貌：前端位于 apps/control-plane-web，由 pnpm workspace 管理；
#   pnpm 版本由根 package.json 的 packageManager 字段经 corepack 锁定，各步骤与 Taskfile.yml
#   的 web:lint / web:test / web:build / web:e2e 同配方，CI 直调底层命令不经 task。
#
# bot-quality：apps/bot-worker 质量门禁（npm 自管、不入 pnpm workspace，见 ADR-064）——
#   npm ci 后依次执行生产依赖审计、类型检查、lint 与构建；
#   npm 缓存以 apps/bot-worker/package-lock.json 为 key。
#
# go-quality：Go 编译与静态检查门禁，并固定执行日志联邦回归测试；
#   使用 Go 1.26.2 与模块缓存，避免后端质量回归只在发布工作流暴露。
#
# workflow-contract：发布工作流契约闸（脚本 release-metadata.test.mjs）。
#   断言 ci.yml / release.yml 的触发条件、runner 与版本来源；原先只在 release.yml 里跑，
#   而 release.yml 不挂 PR，故契约被改坏时 PR 全绿、合入主干才红。前移到 PR 门禁堵住该缺口。

name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # vitest 的 node 项目（纯逻辑，无 DOM）单独成一个 job，与 web-static 并行。
  # 为什么拆：web-static 里 vitest 全 workspace 占 397s（占该 job 511s 的 77%），
  # 而 node 项目自身只要 ~10s——把纯逻辑测试挪到独立 runner 上并行，关键路径不再叠加。
  # 注意：这里刻意**不**跑 dom 项目（dom 留在 web-static），两边都显式 --project，
  # 避免任何一侧静默跑全量导致重复计时。
  web-test-node:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout（不需子模块，纯前端门禁）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装依赖（pnpm workspace）
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: 纯逻辑测试（vitest node 项目）
        run: pnpm --filter control-plane-web exec vitest run --project node

      # devmock 的测试**不在** control-plane-web 的 vitest 项目里（它是独立 workspace 包，
      # 有自管 test 脚本）。拆分 job 时曾漏掉这一步，导致 8 个文件 / 60 个用例（含本 PR
      # 新增的 log-acq-contract 契约测试）从 CI 中完全消失——假绿。
      - name: 假后端自检（devmock 包）
        run: pnpm --filter @jianmanager/devmock test

  web-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout（不需子模块，纯前端门禁）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装依赖（pnpm workspace）
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint（tsc + eslint，等价 task web:lint）
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter control-plane-web exec tsc -b --noEmit
          pnpm --filter control-plane-web lint

      # node 与 dom 两个项目分开跑、分属不同 job（见 web-test-node）：
      # web-static 只负责 dom（组件/页面强断言），node 项目并行到另一个 runner 上，
      # 关键路径因此少一段串行。两者都用 --project 显式指定，避免任一 job 静默跑全量。
      - name: 组件 / 页面测试（vitest dom 项目）
        run: pnpm --filter control-plane-web exec vitest run --project dom

      - name: 构建（主控台 + 组件博物馆，等价 task web:build）
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter control-plane-web build
          pnpm --filter @jianmanager/ui-museum build

  web-e2e:
    name: Web E2E / Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout（不需子模块，纯前端门禁）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装依赖（pnpm workspace）
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器
        working-directory: apps/control-plane-web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E 分片 ${{ matrix.shard }}/4
        working-directory: apps/control-plane-web
        run: pnpm e2e --shard=${{ matrix.shard }}/4

      - name: 上传 Playwright E2E 测试产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-test-results-${{ matrix.shard }}
          path: apps/control-plane-web/test-results
          if-no-files-found: ignore
          retention-days: 7

  web-quality:
    if: always()
    needs: [web-static, web-test-node, web-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: 汇总前端质量门禁
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.web-static.result }}
          NODE_TEST_RESULT: ${{ needs.web-test-node.result }}
          E2E_RESULT: ${{ needs.web-e2e.result }}
        run: |
          set -euo pipefail
          [[ "${STATIC_RESULT}" == "success" ]]
          [[ "${NODE_TEST_RESULT}" == "success" ]]
          [[ "${E2E_RESULT}" == "success" ]]

  bot-quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/bot-worker
    steps:
      - name: Checkout（不需子模块，纯 bot-worker 门禁）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 缓存 npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/bot-worker/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: 安装依赖（npm 自管，不入 pnpm workspace）
        run: npm ci

      - name: Bot Worker 生产依赖审计 / 类型检查 / Lint / 构建
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:prod
          npm run typecheck
          npm run lint
          npm run build

  go-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout（不需子模块，Go 质量门禁）
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Go 编译与静态检查
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      - name: 日志联邦回归测试（覆盖 LogFederation、错误映射与权限摘要）
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/controlplane/router -run 'LogFederation|WriteFederationError|FederationPermissionScopeDigest' -count=1

  # Agent 可证安全闸（FR-388）：策略契约 + 运维面 HTTP 矩阵 + MCP 无状态化契约 + jmagent 单测。
  # 不替代全量 go test ./...（release 仍跑）；本 job 在 PR/分支 push 快速拦截 agent 策略回归。
  # FR-392 已退役 mcp-bridge，改为 CP 内嵌 MCP（FR-389）。
  # FR-489 去会话化后补齐 MCP 覆盖：原先 service 过滤 'AgentToken|AgentGate' 匹配不到
  #   TestActivityByToken_* 与 TestAgentCallLog_*，router 过滤 'AgentGate' 匹配不到 TestMCP_*
  #   （PR #42 时各漏 4 / 14 例），框架层无状态契约与流水截断回归只在 release.yml 的
  #   go test ./... 才执行，PR 阶段无断言保护。
  #   router 侧用 'AgentGate|MCP' 而非 'AgentGate|TestMCP_'：当前两者匹配集合相同，
  #   但前者不依赖 TestMCP_ 命名前缀，避免后续 MCP 用例换个前缀就被静默漏跑。
  # 仅 mcp 包加 -race：SSE 连接注册表是多协程并发读写的共享状态；实测 -race 增量约
  #   +13s（热缓存）/ +43s（含 race 插桩重建），在 job 预算内，故不拆 job 也不全量加 -race。
  agent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'

      - name: Agent 策略与入口闸（断言下限 ≥30 + MCP 无状态化契约）
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/controlplane/service/ -run 'AgentToken|AgentGate|ActivityByToken|AgentCallLog' -count=1
          go test ./internal/controlplane/router/ -run 'AgentGate|MCP' -count=1
          go test -race ./internal/controlplane/mcp/... -count=1
          go test ./apps/jmagent/... -count=1

  # 工作流契约闸：校验 ci.yml / release.yml 的触发条件、runner 与版本来源不被静默改坏。
  # 这些断言原先只在 release.yml 的 metadata job 里跑，而 release.yml 刻意不挂 PR
  # （PR 的 ref 无法解析出合法版本），导致契约被改坏时 PR 全绿、合入主干才红。
  workflow-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 校验发布工作流契约（触发条件 / runner / 版本来源）
        run: node --test scripts/release-metadata.test.mjs

      # cp-lifecycle.sh 的契约测试（2026-10-20 接入）：该脚本的 awk 转义曾把 comm
      # 字段解析错（2026-10-12 生产实测：CP 拒绝 stop/start），而行为测试发现不了这类
      # 缺陷——所以测试直接检查源码形态。但它此前**没有任何自动执行路径**（不在任何
      # workflow、也不在 Taskfile 里），等于门禁对它零保护。放在本 job 是因为语义相近
      # （都是「脚本/工作流的形态契约」）且已有 shell 环境。
      - name: 校验 cp-lifecycle 脚本契约（comm 字段解析）
        run: bash scripts/cp-lifecycle.test.sh
