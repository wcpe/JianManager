  string instance_uuid = 1;
}

// GetInstanceEnvResponse 运行中 JVM 进程实际环境（gopsutil proc.Environ）。
message GetInstanceEnvResponse {
  map<string, string> env = 1;  // 进程实际环境（含继承 + JAVA_HOME/PATH + 自定义）
  bool available = 2;           // false=实例未运行 / 平台读取受限（Windows 等）
  string note = 3;              // 不可用原因
}

