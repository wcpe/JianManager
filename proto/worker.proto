// === JDK 管理 ===

message ListJDKsRequest {}

message JDKInfo {
  string vendor = 1;
  int32 major_version = 2;
  string version = 3;
  string arch = 4;
  string path = 5;
  bool managed = 6;
}

message ListJDKsResponse {
  repeated JDKInfo jdks = 1;
}

message InstallJDKRequest {
  string vendor = 1;       // Temurin / Zulu / Corretto / ...
  int32 major_version = 2; // 8 / 11 / 17 / 21 / ...
  string arch = 3;         // x64 / aarch64
  string install_dir = 4;   // 可选：自定义安装目录（默认 <serversDir>/jdks/<vendor>-<major>）
  // mirror_base 是该 vendor 的下载基址（CP 从平台设置 jdk.mirror.<vendor> 取生效值后下发）。
  // 非空时 Worker 用它构造下载 URL，使运行时配置的镜像源真生效；为空时回退 Worker 本地 env/默认源。
  string mirror_base = 5;
  // task_id 是 CP 生成的任务业务 ID（FR-183，见 ADR-040）。非空时 Worker 异步执行安装：
  // 启动即返回、后台下载、经心跳按此 task_id 上报进度/日志/终态。为空时回退同步安装（向后兼容）。
  string task_id = 6;
  // version 具体 JDK 版本（FR-178，可选，如 "21.0.4"）。非空时经 foojay disco 按具体版本解析下载源；
  // 为空时按 major_version 取该大版本最新 GA（沿用直链/foojay latest）。
  string version = 7;
}

// === JDK 版本目录（foojay，FR-178）===

message JDKCatalogRequest {
  string vendor = 1;       // 发行版名（Temurin/Liberica/Microsoft/Semeru/GraalVM…）
  int32 major_version = 2; // 大版本过滤（<=0 表示该发行版可用大版本概览）
  string arch = 3;         // x64 / aarch64（空=本机架构）
}

// JDKCatalogPackage 一条可选的 JDK 构建（喂前端版本选择器）。
message JDKCatalogPackage {
  string distribution = 1; // foojay distribution slug
  int32 major_version = 2;
  string java_version = 3; // 具体版本（如 21.0.4）
  string archive_type = 4; // tar.gz / zip
  bool latest = 5;         // 是否该大版本最新可用构建
}

message JDKCatalogResponse {
  repeated JDKCatalogPackage packages = 1;
  string error = 2; // 查询失败原因（foojay 不可达等；packages 为空）
}

message InstallJDKResponse {
  bool success = 1;     // 异步语义下表示「已受理并启动」；同步语义下表示「安装成功」
  string error = 2;
  JDKInfo jdk = 3;      // 仅同步路径返回；异步路径为空（结果经心跳终态的 result 回传）
  // task_id 回显受理的任务 ID（异步路径，FR-183）。CP 据此把 Task 置为 running。
  string task_id = 4;
}

message RemoveJDKRequest {
  string path = 1;
}

message RemoveJDKResponse {
  bool success = 1;
  string error = 2;
}

// === 子服搭建（FR-034） ===

message DownloadCoreRequest {
  string instance_uuid = 1;
  string dest_filename = 2; // 落地文件名（如 server.jar），相对实例工作目录
  string download_url = 3;
  string sha256 = 4;        // 可选；非空时校验下载内容

  // 组合缓存键成分（FR-330）：sha256 为空的下载源（Sponge Maven 等）按
  // core_type|mc_version|build 定位节点核心缓存。CP 必须把 latest/未指定构建
  // 解析为具体构建后再下发；三者缺任一（如 BungeeCord latest 无构建号）则不参与组合键缓存。
  string core_type = 5;   // 核心类型（paper / spongevanilla / velocity …）
  string mc_version = 6;  // 具体 MC 版本（"latest" 不参与组合键）
  int32 build = 7;        // 具体构建号（<=0 不参与组合键）
}

message DownloadCoreResponse {
  bool success = 1;
  string error = 2;
  int64 size = 3;
  bool cache_hit = 4; // FR-330：本次交付来自节点核心缓存（免远程下载），CP 据此区分 provision stage 文案
}

message InstallForgeServerRequest {
  string instance_uuid = 1;
  string forge_installer_url = 2;
  string forge_installer_sha256 = 3; // 可选；非空时校验 Forge installer
  string spongeforge_url = 4;
  string spongeforge_sha256 = 5;     // 可选；非空时校验 SpongeForge mod
  string spongeforge_filename = 6;   // 默认 SpongeForge.jar，落到 mods/ 下
  string launch_jar = 7;             // 预期 Forge 服务端启动 jar（如 forge-<ver>-server.jar）
}

message InstallForgeServerResponse {
  bool success = 1;
  string error = 2;
  string launch_jar = 3;
  int64 spongeforge_size = 4;
}

// === 节点制品缓存（FR-178） ===

// ArtifactCacheItem 一条节点本地制品缓存项（meta 缺失时 name/version 为空、size 取 blob 实际大小）。
message ArtifactCacheItem {
  string sha256 = 1;
  string name = 2;          // 人类可读名（落地文件名 / CP 由 asset 表补全）
  string type = 3;          // 制品类型（首版固定 core）
  string version = 4;       // 版本标记，可空
  int64 size = 5;           // 字节数
  int64 cached_at = 6;      // 首次存入时间（Unix 秒）
  int64 last_used_at = 7;   // 最近命中/存入时间（Unix 秒，LRU 依据）
}

message ListArtifactCacheRequest {}

message ListArtifactCacheResponse {
  repeated ArtifactCacheItem items = 1;
  int64 total_bytes = 2;  // 缓存总占用（所有 blob 之和）
  int64 cap_bytes = 3;    // 当前容量上限（0=不限）
}

message EvictArtifactCacheRequest {
  string sha256 = 1;
}

message EvictArtifactCacheResponse {
  bool success = 1;
  string error = 2;
}

message ClearArtifactCacheRequest {}

message ClearArtifactCacheResponse {
  bool success = 1;
  string error = 2;
  int32 removed = 3; // 被清除的缓存项数量
}

message SetArtifactCacheCapRequest {
  int64 cap_bytes = 1; // 容量上限（字节，0=不限）
}

message SetArtifactCacheCapResponse {
  bool success = 1;
  string error = 2;
  int64 cap_bytes = 3;     // 设定后的上限
  int64 total_bytes = 4;   // 设定（含可能的 LRU 淘汰）后的总占用
}

// === 节点目录浏览（FR-178，目录选择器） ===

message BrowseDirRequest {
  // path 节点上的绝对路径（空=列出根/盘符等可选起点）。仅列子目录，只读。
  string path = 1;
}

// BrowseDirEntry 一个子目录项。
message BrowseDirEntry {
  string name = 1; // 目录名（basename）
  string path = 2; // 绝对路径
  // FR-373 权限元数据（加性）。
  string mode_octal = 3;
  string mode_string = 4;
  bool readable = 5;
  bool writable = 6;
  string owner = 7;
  string group = 8;
}

message BrowseDirResponse {
  bool success = 1;
  string error = 2;
  string path = 3;             // 实际浏览的规范化绝对路径
  string parent = 4;           // 父目录绝对路径（已在根则为空）
  repeated BrowseDirEntry dirs = 5; // 子目录列表（不含文件）
}

// ProbeJDK 探测某路径的 JDK 信息（FR-228）：path 可为 JDK home 目录或 java 可执行文件，Worker 归一后探测。
message ProbeJDKRequest {
  string path = 1;
}
message ProbeJDKResponse {
  bool valid = 1;             // 是否为有效 JDK（找到 bin/java 且能取版本）
  string vendor = 2;          // 归一后的厂商（Temurin/Corretto/Zulu/...）
  int32 major_version = 3;    // 主版本（如 21）
  string version = 4;         // 完整版本（如 21.0.4+9）
  string arch = 5;            // 架构（x64/aarch64...）
  string java_home = 6;       // 归一后的 JDK home 绝对路径（登记用 path）
  string error = 7;           // valid=false 时的原因
}

// === 节点运行时库（FR-298）===

// ScanRuntimes 扫描常见安装路径发现运行时候选（jdk/nodejs）。
message ScanRuntimesRequest {
  // types 过滤要扫描的运行时类型（jdk / nodejs）；空 = 扫描全部支持类型。
  repeated string types = 1;
}

// RuntimeCandidate 一条扫描发现的运行时候选。
message RuntimeCandidate {
  string type = 1;             // 运行时类型（jdk / nodejs）
  string vendor = 2;           // jdk=归一厂商（Temurin/...）；nodejs=展示名（Node.js）
  string version = 3;          // 完整版本（如 21.0.4+9 / 22.17.0）
  int32 major_version = 4;     // 主版本（如 21 / 22）
  string arch = 5;             // 架构（jdk：os.arch；nodejs：process.arch 的 x64/arm64）
  string path = 6;             // jdk=home 目录绝对路径；nodejs=node 可执行文件绝对路径
  bool already_registered = 7; // 位于 Worker 托管根下（已在库），CP 侧另按 DB 记录补标
}

message ScanRuntimesResponse {
  repeated RuntimeCandidate candidates = 1;
}

// InstallRuntime 下载并安装运行时（FR-299，首批 nodejs：nodejs.org dist 便携归档）。
message InstallRuntimeRequest {
  string type = 1;        // 运行时类型（首批仅 nodejs）
  int32 major = 2;        // 主版本（如 22）
  // arch 用该运行时下载源的命名（nodejs：x64 / arm64；CP 已按类型归一，FR-289 语义）。
  // 为空时 Worker 按本机 GOARCH 推导。
  string arch = 3;
  // mirror_base 下载基址（CP 从平台设置 runtime.mirror.nodejs 取生效值后下发）。
  // 为空时回退 Worker 本地 env/官方默认源（https://nodejs.org/dist）。
  string mirror_base = 4;
  // task_id CP 任务业务 ID（FR-183 异步语义同 InstallJDK）：必填，Worker 启动即返回，
  // 后台下载解压，进度/日志/终态经心跳按此 task_id 上报。
  string task_id = 5;
}

message InstallRuntimeResponse {
  bool success = 1;   // 已受理并启动（异步）
  string error = 2;
  string task_id = 3; // 回显受理的任务 ID（CP 据此把 Task 置为 running）
}

// RemoveRuntime 删除托管运行时目录（FR-299）。path 可为登记的内层路径（如 …/bin/node），
// Worker 归一到托管根（opt/runtimes）下的顶层子目录整体删除（FR-292 语义）。
message RemoveRuntimeRequest {
  string type = 1; // 运行时类型（首批仅 nodejs）
  string path = 2;
}

message RemoveRuntimeResponse {
  bool success = 1;
  string error = 2;
}

// PMRegistry 单条 registry（FR-306）。scope 空=默认源；非空=@scope 域源。token 可选凭据。
message PMRegistry {
  string name = 1;
  string url = 2;
  string scope = 3;
  string token = 4; // CP→Worker 下发明文；Worker→CP 回读时清空（不回传凭据）
}

message GetPMConfigRequest {
  string pm = 1; // CP 侧 DB 偏好，Worker 据此报该 PM 版本（空=npm）
}

message GetPMConfigResponse {
  string pm = 1;                     // 当前 PM 偏好（npm/pnpm/yarn）
  bool corepack_available = 2;       // 托管 Node 是否含 corepack
  string pm_version = 3;             // 已激活 PM 版本（<pm> --version）
  repeated PMRegistry registries = 4; // 托管 .npmrc 现有 registry（token 已清空）
  string node_bin = 5;               // 定位到的托管 node 可执行（诊断用）
}

message SetPMConfigRequest {
  string pm = 1;
  repeated PMRegistry registries = 2;
}

message SetPMConfigResponse {
  bool success = 1;
  string error = 2;
  string pm_version = 3; // 激活后的 PM 版本
}

// 全局包可视化管理（FR-307）：托管全局目录 <数据根>/opt/runtimes/global，
// PM 操作统一带托管 .npmrc（NPM_CONFIG_USERCONFIG）与托管 Node PATH。
message GlobalPackage {
  string name = 1;
  string version = 2;
  string latest = 3; // outdated 探测到的最新版（空=已最新/探测失败）
}

message ListGlobalPackagesRequest {
  string pm = 1; // npm|pnpm（yarn 全局不支持，回明确错误）
}

message ListGlobalPackagesResponse {
  bool success = 1;
  string error = 2;
  repeated GlobalPackage packages = 3;
}

message InstallGlobalPackageRequest {
  string pm = 1;
  string name = 2;    // 包名（含 @scope/ 前缀合法）
  string version = 3; // 空=latest
  string task_id = 4; // 必填：任务中心异步（进度/日志经心跳上报）
}

message InstallGlobalPackageResponse {
  bool success = 1; // 任务已受理
  string error = 2;
  string task_id = 3;
}

message RemoveGlobalPackageRequest {
  string pm = 1;
  string name = 2;
}

message RemoveGlobalPackageResponse {
  bool success = 1;
  string error = 2;
}

message DeployServerProbeRequest {
  string instance_uuid = 1;
  // jar 探针插件 jar 字节（CP 由 go:embed 取出后下发；为空表示未捆绑探针，跳过 jar 写入）。
  bytes jar = 2;
  // config_yaml 生成的 plugins/ServerProbe/config.yml 内容（已按分配端口开启 /metrics）。
  string config_yaml = 3;
  // libraries_zip 是构建期预置的 ServerProbe 运行库缓存包（zip 内根路径为 libraries/）。
  // Worker 解压到实例工作目录根，避免探针首启联网拉 TabooLib/Kotlin 依赖（FR-114）。
  bytes libraries_zip = 4;
}

message DeployServerProbeResponse {
  bool success = 1;
  string error = 2;
}

// === 一键复制子服（FR-036） ===

message CloneWorkDirRequest {
  string src_instance_uuid = 1; // 源实例（须已注册，提供其工作目录）
  string dst_instance_uuid = 2; // 目标实例（须已注册，提供其工作目录）
  repeated string exclude = 3;  // 相对源工作目录的排除项：目录前缀、精确路径或 basename glob（如 *.pid）
  // include 仅复制顶层段命中的项（目录前缀 / basename glob，如 plugins、*.jar；FR-231）。
  // 为空=复制全部（仅受 exclude 约束，向后兼容）；非空仍叠加 exclude。
  repeated string include = 4;
}

message CloneWorkDirResponse {
  bool success = 1;
  string error = 2;
  int64 copied_files = 3;
  int64 copied_bytes = 4;
  repeated string skipped = 5; // 被排除跳过的顶层项/目录（回报用）
}

// === 实例删除清理 ===

message RemoveInstanceRequest {
  string instance_uuid = 1;
  // work_dir 是 CP 记录的工作目录（数据根相对路径，ADR-010）。
  // Worker 注册表命中时以注册的绝对路径为准；未命中（如 Worker 重启后未重推）时据此解析兜底。
  string work_dir = 2;
  // skip_work_dir 就地导入实例（FR-302，见 ADR-069）：CP 显式指示跳过目录删除，
  // 仅移除注册与派生索引，原目录绝不清理（与托管区守卫互为双保险）。
  bool skip_work_dir = 3;
}

message RemoveInstanceResponse {
  bool success = 1;
  string error = 2;
  // work_dir_skipped 表示目录未被删除但不阻断实例删除：
  // 目录在托管区（数据根 var/servers）之外（历史手填绝对路径）或无数据根时，
  // Worker 拒绝越界 RemoveAll，仅移除注册，skip_reason 说明原因。
  bool work_dir_skipped = 3;
  string skip_reason = 4;
}

// === Docker 镜像管理（FR-078，见 ADR-019） ===

message ListImagesRequest {}

// ImageInfo 描述 Worker 本机一个 Docker 镜像。
message ImageInfo {
  string id = 1;             // 镜像 ID（sha256:...）
  repeated string tags = 2;  // RepoTags（如 itzg/minecraft-server:latest）
  int64 size_bytes = 3;      // 镜像占用字节
  int64 created = 4;         // 创建时间（Unix 秒）
}

message ListImagesResponse {
  repeated ImageInfo images = 1;
  // docker_available 为 false 表示本机未安装/未运行 Docker 守护进程。
  bool docker_available = 2;
  string error = 3;
}

message PullImageRequest {
  string image = 1; // 镜像引用（含 tag），默认 Docker Hub
}

message PullImageResponse {
  bool success = 1;
  string error = 2;
}

message RemoveImageRequest {
  string image = 1; // 镜像引用或 ID
  bool force = 2;    // 强制删除（即使有停止的容器引用）
}

message RemoveImageResponse {
  bool success = 1;
  string error = 2;
}

// === 备份操作（FR-013/FR-056/FR-057） ===

// StorageBackendSpec 远程存储后端的传输参数。
// 凭证由 Control Plane 侧从 ${ENV_VAR} 解析后填入（CP 拥有配置/DB），
// Worker 视其为不透明传输参数，仅按 type 执行上传/下载。参见 config-files.md。
message StorageBackendSpec {
  string type = 1;        // local | s3 | sftp | webdav
  string endpoint = 2;    // S3 endpoint / WebDAV base URL / SFTP host:port
  string bucket = 3;      // S3 bucket（其余后端忽略）
  string region = 4;      // S3 region
  string prefix = 5;      // 对象键/远程目录前缀
  string access_key = 6;  // 已解析凭证：S3 access key / SFTP 用户名 / WebDAV 用户名
  string secret_key = 7;  // 已解析凭证：S3 secret key / SFTP 密码 / WebDAV 密码
  bool use_ssl = 8;       // S3 是否启用 TLS
}

// BackupManifestEntry 备份清单中的单个文件指纹，用于增量差异比对。
message BackupManifestEntry {
  string path = 1;     // 相对实例工作目录、以「/」分隔的可移植路径
  int64 size = 2;      // 字节数
  int64 mod_time = 3;  // 修改时间 Unix 秒
}

message CreateBackupRequest {
  string instance_uuid = 1;          // 目标实例（据其工作目录打包）
  string backup_uuid = 2;            // 备份 UUID，决定归档文件名
  bool incremental = 3;              // 是否增量
  repeated BackupManifestEntry base_manifest = 4; // 增量基准清单（链上各前序备份合并后的文件指纹）
  StorageBackendSpec storage = 5;    // 非空且 type!=local 时，打包后上传到该远程后端
}

message CreateBackupResponse {
  bool success = 1;
  string error = 2;
  string rel_path = 3;               // 归档相对节点数据根的路径（var/backups/<instanceID>/<uuid>.tar.gz）
  int64 size_bytes = 4;              // 归档字节数
  int64 file_count = 5;              // 本次实际打包文件数（增量为变化文件数）
  repeated BackupManifestEntry manifest = 6; // 本次备份后实例工作目录的完整清单（供下次增量比对与链回放）
  string storage_key = 7;            // 上传到远程后的对象键（本地备份为空）
  string checksum_sha256 = 8;        // 归档 tar.gz 的 SHA-256，供 CP 持久化与恢复前校验
  string checksum_algo = 9;          // 校验算法，当前固定 sha256，便于后续兼容扩展
}

message RestoreBackupRequest {
  string instance_uuid = 1;          // 目标实例（恢复到其工作目录）
  repeated string rel_paths = 2;     // 备份链归档相对路径，按顺序回放（全量基在前，增量依次在后）
  StorageBackendSpec storage = 3;    // 非空且 type!=local 时，归档先从远程拉回本地再回放
  repeated string storage_keys = 4;  // 与 rel_paths 对应的远程对象键（远程恢复用）
  repeated string checksum_sha256 = 5; // 与 rel_paths 对应的 SHA-256；为空时兼容旧备份跳过校验
}

message RestoreBackupResponse {
  bool success = 1;
  string error = 2;
  int64 restored_files = 3;          // 回放写入的文件数
}

message TestStorageBackendRequest {
  StorageBackendSpec storage = 1;
}

message TestStorageBackendResponse {
  bool success = 1;
  string error = 2;
  int64 latency_ms = 3;
  string error_code = 4;
}

// === 插件桥（ServerProbe 反向 WS ↔ Worker，FR-065，见 ADR-016）===
//
// 一次铺齐桥全面：事件（PluginEvent）/命令（PluginCommand）/状态查询（QueryServerState*）。
// 地基（FR-065）仅真实使用 PluginEvent 的 connected/disconnected/heartbeat；其余字段为骨架，
// 语义由 FR-066/067/068 填充。

message StreamPluginEventsRequest {
  string instance_uuid = 1; // 空表示订阅所有实例
}

// PluginEvent 探针经反向 WS 上报、由 Worker 经本流冒泡给 CP 的事件。
// type 取值：connected | disconnected | heartbeat | player_join | player_quit
//          | chat | cross_server | command_result | state
message PluginEvent {
  string instance_uuid = 1;
  string type = 2;
  int64 timestamp = 3;
  string player_name = 4;   // 玩家事件：玩家名
  string player_uuid = 5;   // 玩家事件：玩家 UUID
  string message = 6;       // chat 内容 / 事件描述
  string server = 7;        // 子服名（玩家所在/事件发生）
  string from_server = 8;   // cross_server：来源子服
  string to_server = 9;     // cross_server：目标子服
  string platform = 10;     // bukkit | bungee（来自探针 hello）
  string version = 11;      // 探针版本
  string request_id = 12;   // command_result 对应的请求标识
  string raw_json = 13;     // 透传原始载荷（下游按需解析）
  // domain 业务域命名空间（JBIS，FR-115/ADR-027）：空/core=监控/治理既有事件；
  // economy/inventory… 为业务域事件，CP 据此分流落业务汇聚而非监控。
  string domain = 14;
  // dedup_key 业务事件去重键（JBIS）：CP 按 (domain,dedup_key) 幂等落库（至少一次投递去重）；
  // 监控事件此字段空。
  string dedup_key = 15;
}

// PluginCommand CP 下发给探针的治理/查询指令。
// action 取值：kick | ban | unban | whitelist_add | whitelist_remove | list | query_state
message PluginCommand {
  string action = 1;
  string target = 2;        // 目标玩家名/UUID
  string reason = 3;        // 踢/封原因
  repeated string args = 4; // 透传额外参数
  string request_id = 5;    // 关联 command_result 回执
  // domain 业务域命名空间（JBIS，FR-115/ADR-027）：空/core=内建治理（既有 kick/ban…）；
  // economy/inventory… 为业务域，Worker 按 domain 前缀路由到对应桥业务会话。
  string domain = 6;
  // payload_json 结构化业务参数（JBIS）：业务动作的入参以 JSON 承载（如 economy.balance 的 player/currency），
  // 与 args（治理用 repeated string）并存；治理命令此字段空。
  string payload_json = 7;
}

message SendPluginCommandRequest {
  string instance_uuid = 1;
  PluginCommand command = 2;
  // wait=true 时 Worker 同步等待探针的 command_result 回执（FR-067 治理：踢/封/解封/白名单/在线列表）。
  // wait=false 为即发即忘（仅校验已下发，不等结果）。
  bool wait = 3;
}

message SendPluginCommandResponse {
  bool success = 1;
  string error = 2;
  string request_id = 3;
  // output 是探针执行指令的输出（list/whitelist 等查询结果；wait=true 且执行成功时填充，FR-067）。
  string output = 4;
}

message QueryServerStateRequest {
  string instance_uuid = 1;
}

message QueryServerStateResponse {
  bool success = 1;
  string error = 2;
  bool connected = 3;       // 探针当前是否在线
  string state_json = 4;    // 聚合状态 JSON（下游填充）
}

// === 面板自更新（FR-081，见 ADR-020 §4） ===

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1; // Worker 当前版本（internal/version.Version）
  string os = 2;      // runtime.GOOS（linux/windows/darwin）
  string arch = 3;    // runtime.GOARCH（amd64/arm64）
  string backup_version = 4; // 本地升级前备份的版本（无备份为空，供 CP 透出 backupVersion，FR-182）
}

// CheckDocker 探测本机 Docker 守护进程可用性（FR-237）。
message CheckDockerRequest {}

message CheckDockerResponse {
  bool available = 1;  // Docker 守护进程是否可达
  string version = 2;  // Docker Engine 版本（available=true 时）
  string error = 3;    // 不可用时的原因（available=false 时）
}

message UpgradeWorkerRequest {
  string download_url = 1;   // 目标 Worker 二进制下载地址（CP 据 feed + 节点平台解析后下发）
  string sha256 = 2;         // 期望 sha256（Worker 下载后校验，不符拒绝替换）
  string target_version = 3; // 目标版本号（仅记录/回报）
  bool allow_insecure = 4;   // 是否允许 http 下载源（默认仅 https；本地/内网自测可开）
  // action 升级动作（FR-182，加性向后兼容）：空/"upgrade"=既有下载替换升级；
  // "rollback"=回滚本地升级前备份（忽略 download_url/sha256，Worker 用自己的备份换回上一版）。
  string action = 5;
}

message UpgradeWorkerResponse {
  bool success = 1;        // 替换成功、重启已计划
  string error = 2;        // 失败原因（下载失败/校验不符/替换失败）
  string from_version = 3; // 升级前版本
}

// === 归档浏览与反编译（FR-075，见 ADR-018） ===

message ListArchiveEntriesRequest {
  string instance_uuid = 1;
  string path = 2;          // 相对工作目录的归档文件路径（.jar/.zip）
}

// ArchiveEntry 归档（zip/jar）内的单个条目（扁平，前端按「/」重建子树）。
message ArchiveEntry {
  string name = 1;            // 归档内条目名（「/」分隔；目录条目以「/」结尾）
  bool is_dir = 2;
  int64 size = 3;            // 解压后字节
  int64 compressed_size = 4;
  int64 modified = 5;       // Unix 秒
  uint32 crc32 = 6;
}

message ListArchiveEntriesResponse {
  repeated ArchiveEntry entries = 1;
  bool truncated = 2;       // 条目数超上限被截断
}

message ReadArchiveEntryRequest {
  string instance_uuid = 1;
  string path = 2;          // 归档文件路径
  string entry = 3;         // 归档内条目名
}

message ReadArchiveEntryResponse {
  bytes content = 1;        // 内容（截断到上限）
  bool truncated = 2;
  bool binary = 3;          // 嗅探为二进制（前端不文本预览）
}

message DecompileClassRequest {
  string instance_uuid = 1;
  string path = 2;          // 工作目录内 .class 或 .jar 路径
  string entry = 3;         // 可选：path 为 .jar 时反编译 jar 内某 .class 条目；空=反编译整个 jar
}

message DecompileClassResponse {
  bool success = 1;
  string error = 2;         // 失败/降级原因（无 JDK / 无 CFR / 超时 / 超限 / CFR 非 0 退出）
  string source = 3;        // 反编译 Java 源码（截断到上限）
  bool truncated = 4;
  string decompiler = 5;    // 反编译器标识（如 "CFR 0.152"）
}


// === 终端会话隧道桥（FR-281 M2，见 ADR-066）===

// TerminalFrame 终端会话双向流的帧：首帧（CP→Worker）必须为 open，其后双向均为不透明 WS 帧搬运。
message TerminalFrame {
  oneof kind {
    TerminalOpen open = 1;       // 会话建立（仅 CP→Worker 首帧）
    TerminalWSFrame frame = 2;   // 不透明 WS 帧（双向）
  }
}

// TerminalOpen 会话建立请求 / 就绪应答：
// CP→Worker 首帧携带一次性终端令牌（Worker 以其 WS 令牌密钥校验，ADR-061 信任模型不变，CP 不代校验）；
// Worker→CP 方向 token 为空，作「会话就绪 ack」——CP 据此确定性区分 就绪/令牌被拒/老 Worker 回退。
message TerminalOpen {
  string token = 1;
}

// TerminalWSFrame 原样搬运的 WebSocket 数据帧（对既有终端 WS 协议零侵入）。
message TerminalWSFrame {
  int32 msg_type = 1;   // gorilla/websocket 消息类型（1=Text，2=Binary）
  bytes payload = 2;
}

// === 导入现有服务器（FR-302，见 ADR-069）===

message InspectServerDirRequest {
  // path 导入根目录（节点上的绝对路径）。
  string path = 1;
}

// ImportJarCandidate 一个核心 jar 候选。
message ImportJarCandidate {
  string path = 1;             // 相对导入根、以「/」分隔的路径（深度≤2）
  int64 size = 2;              // 字节
  string main_class_hint = 3;  // MANIFEST Main-Class 嗅探结果（仅排序/展示提示，可为空）
}

// ImportJdkCandidate 一个内嵌 JDK 候选（jre*/jdk*/runtime/java 子目录经 JDK 探测确认）。
message ImportJdkCandidate {
  string path = 1;             // JDK home 绝对路径
  string vendor = 2;
  string version = 3;
  int32 major_version = 4;
  string arch = 5;
}

message InspectServerDirResponse {
  bool success = 1;
  string error = 2;            // 守卫拒绝/探测失败原因
  repeated ImportJarCandidate jars = 3;
  repeated ImportJdkCandidate jdks = 4;
  int32 server_port = 5;       // server.properties 的 server-port（0=未知）
  bool eula_accepted = 6;      // eula.txt 是否 eula=true
  bool props_found = 7;        // 是否存在可解析的 server.properties
}

message ImportServerDirRequest {
  string path = 1;         // 导入根目录（节点上的绝对路径）
  string mode = 2;         // in_place | migrate
  string target_slug = 3;  // migrate 模式的托管区目标目录名（<slug>-<shortid>，CP 生成）
}

message ImportServerDirResponse {
  bool success = 1;
  string error = 2;
  string work_dir = 3;     // 最终工作目录在节点上的绝对路径
  bool moved = 4;          // migrate 是否实际完成搬迁（in_place 恒为 false）
}

// === Bot fleet（FR-351，一次铺齐下游共享字段）===

message GetBotCapacityRequest {}

message GetBotCapacityResponse {
  bool ready = 1;
  bool legacy = 2;
  int32 max_bots = 3;
  int32 active_bots = 4;
  int32 connecting_bots = 5;
  int64 capacity_generation = 6;
  string worker_epoch = 7;
  int64 worker_epoch_generation = 8;
  string bot_worker_version = 9;
  int64 rss_bytes = 10;
  double event_loop_p95_ms = 11;
  int64 observed_at_unix_ms = 12;
  string unavailable_reason = 13;
  repeated string features = 14;
}

message BotAssignment {
  string bot_uuid = 1;
  string instance_uuid = 2;
  string session_uuid = 3;
  int64 generation = 4;
  string desired_state = 5; // running/stopped
  string config_hash = 6;
  string name = 7;
  string host = 8;
  int32 port = 9;
  string username = 10;
  string version = 11;
  string auth = 12;
  string cohort_key = 13;
  string scenario_json = 14;
  string resume_step_id = 15;
  int64 connect_not_before_unix_ms = 16;
  string correlation_seed = 17;
}

message ApplyBotBatchRequest {
  string batch_id = 1;
  string idempotency_key = 2;
  int64 expected_capacity_generation = 3;
  repeated BotAssignment assignments = 4;
}

message ApplyBotBatchItemResult {
  string bot_uuid = 1;
  bool accepted = 2;
  bool skipped = 3;
  string status = 4;
  string error_code = 5;
  string error = 6;
}

message ApplyBotBatchResponse {
  string batch_id = 1;
  string idempotency_key = 2;
  repeated ApplyBotBatchItemResult results = 3;
  int64 capacity_generation = 4;
}

message GetBotFleetSnapshotRequest {
  string session_uuid = 1; // 空表示本节点全部 Bot
}

message BotPosition {
  double x = 1;
  double y = 2;
  double z = 3;
}

message BotRuntimeSnapshot {
  string bot_uuid = 1;
  string session_uuid = 2;
  int64 generation = 3;
  string config_hash = 4;
  string worker_epoch = 5;
  int64 worker_epoch_generation = 6;
  int64 event_seq = 7;
  string status = 8;
  string current_step_id = 9;
  double health = 10;
  int32 food = 11;
  BotPosition pos = 12;
  int32 reconnect_count = 13;
  string error_code = 14;
  string last_error = 15;
  int64 observed_at_unix_ms = 16;
}

message GetBotFleetSnapshotResponse {
  repeated BotRuntimeSnapshot bots = 1;
  int64 capacity_generation = 2;
  int64 observed_at_unix_ms = 3;
}

message StreamBotFleetEventsRequest {
  string session_uuid = 1; // 空表示本节点全部活动 Bot
}

message BotActionEvent {
  string bot_uuid = 1;
  string session_uuid = 2;
  int64 generation = 3;
  string action_run_id = 4;
  string step_id = 5;
  int32 attempt = 6;
  string status = 7; // running/succeeded/failed/timed_out/cancelled
  string error_code = 8;
  string message = 9;
  string correlation_token = 10;
  string result_json = 11;
  int64 duration_ms = 12;
  int64 observed_at_unix_ms = 13;
}

message BotFleetEvent {
  oneof event {
    BotRuntimeSnapshot runtime_snapshot = 1;
    BotActionEvent action_event = 2;
  }
}

message BotActionSignal {
  string signal_id = 1;
  string bot_uuid = 2;
  string session_uuid = 3;
  int64 generation = 4;
  string action_run_id = 5;
  string step_id = 6;
  string type = 7; // probe/barrier/cancel
  string correlation_token = 8;
  string payload_json = 9;
  int64 observed_at_unix_ms = 10;
}

message SignalBotActionsRequest {
  repeated BotActionSignal signals = 1;
}

message SignalBotActionItemResult {
  string signal_id = 1;
  bool accepted = 2;
  bool skipped = 3;
  string error_code = 4;
  string error = 5;
}

message SignalBotActionsResponse {
  repeated SignalBotActionItemResult results = 1;
}
