syntax = "proto3";

package worker;

option go_package = "github.com/wcpe/JianManager/proto/workerpb";

// WorkerService 定义 Control Plane 与 Worker Node 之间的 gRPC 服务。
service WorkerService {
  // Register Worker Node 首次启动时注册到 Control Plane。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Heartbeat 双向心跳流，Worker 上报资源指标。
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
  // FetchBotWorkerArchive Worker 自愈拉取 CP 内嵌的 bot-worker dist 归档（FR-308，CP 侧实现）：
  // 携带节点身份鉴权 + 本地已知 sha256，指纹一致回空归档（省流），否则回 tar.gz 字节。
  rpc FetchBotWorkerArchive(FetchBotWorkerArchiveRequest) returns (FetchBotWorkerArchiveResponse);
  // ReportCrashSnapshot Worker 上报实例崩溃快照（FR-313，CP 侧实现）：进程非正常退出
  //（退出码 ≠ 0 或 RUNNING/STARTING 态意外退出）时携带节点身份上报现场（退出码/信号/
  // 时长/尾部输出），CP 持久化并按实例滚动保留最近 5 条。与注册/心跳同信道（隧道/直拨
  // 双模式天然可用）；老 CP 返回 Unimplemented，Worker 记日志丢弃、不阻塞状态机。
  rpc ReportCrashSnapshot(ReportCrashSnapshotRequest) returns (ReportCrashSnapshotResponse);
  // CreateInstance 在指定 Worker 上创建实例。
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
  // ResyncInstances Worker 重连/重注册后，CP 一次性重推该节点全部实例规格，
  // Worker 用它填充内存注册表（不在表者按 STOPPED 注册、不启动进程；已在表者跳过，
  // 不覆盖 RecoverDaemonInstances 恢复的 RUNNING 实例）。使重启后停机实例的
  // 文件/配置/归档/备份 op 能定位工作目录（FR-FIXA 修 bug #2，见 ADR-050）。
  rpc ResyncInstances(ResyncInstancesRequest) returns (ResyncInstancesResponse);
  // StartInstance 启动实例。
  rpc StartInstance(InstanceActionRequest) returns (InstanceActionResponse);
  // StopInstance 停止实例。
  rpc StopInstance(InstanceActionRequest) returns (InstanceActionResponse);
  // RestartInstance 重启实例。
  rpc RestartInstance(InstanceActionRequest) returns (InstanceActionResponse);
  // KillInstance 强制终止实例。
  rpc KillInstance(InstanceActionRequest) returns (InstanceActionResponse);
  // 启动前同步预检（FR-314）：复用 InstanceActionResponse（success=预检通过，message=拼接失败原因）。
  rpc PreflightStartInstance(InstanceActionRequest) returns (InstanceActionResponse);
  // SendCommand 向实例发送命令。
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  // GetInstanceStatus 获取实例状态。
  rpc GetInstanceStatus(InstanceActionRequest) returns (GetInstanceStatusResponse);
  // ListInstances 列出 Worker 上所有实例。
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  // StreamInstanceEvents 订阅实例事件流。
  rpc StreamInstanceEvents(StreamInstanceEventsRequest) returns (stream InstanceEvent);
  // IssueTerminalToken 签发一次性终端连接 token。
  rpc IssueTerminalToken(IssueTerminalTokenRequest) returns (IssueTerminalTokenResponse);
  // ListFiles 列出实例工作目录下的文件。
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // ReadFile 读取文件内容。
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // WriteFile 写入文件内容。
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // DeleteFile 删除文件。
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // RenameFile 重命名文件。
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  // CheckPathAccess 探测路径可读/可写（相对 Worker 进程用户，FR-373）。
  // instance_uuid 非空：path 为实例工作目录相对路径；为空：path 须为节点绝对路径（与 BrowseDir 同语义）。
  rpc CheckPathAccess(CheckPathAccessRequest) returns (CheckPathAccessResponse);
  // ChmodPath 对单 path 做非递归 chmod（FR-373；不 chown、不递归）。
  // instance_uuid 非空：实例相对路径；为空：节点绝对路径。mode 空=保证属主可读写（目录含 x）。
  rpc ChmodPath(ChmodPathRequest) returns (ChmodPathResponse);
  // DownloadArchive 把选中的文件/目录（目录递归）即时打包为 zip 并分块流式返回（FR-070 批量下载）。
  rpc DownloadArchive(DownloadArchiveRequest) returns (stream DownloadArchiveChunk);
  // DownloadFile 单文件分块流式下载（原样字节，不打包）。
  // ReadFile 的 10MiB 上限是在线编辑器护栏，下载必须走本 RPC，任意大小不截断。
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileChunk);
  // UploadFile 单文件分块流式上传（与 DownloadFile 对称，FR-304）。
  // WriteFile unary 受服务端单消息上限约束（直拨 64MiB 拒收）且反向隧道无上限会整块缓冲，
  // 大文件上传必须走本 RPC：Worker 落临时文件、收完原子改名，中途失败不留半截目标文件。
  // 首帧必须携带 instance_uuid + path（content 可同帧携带），后续帧仅 content（其余字段忽略）；
  // 零帧即关流约定返回 success=false（不触盘、无副作用），供 CP 作老 Worker 能力探测
  // （老 Worker 对本 RPC 返回 Unimplemented，CP 借此区分并回退 WriteFile）。
  rpc UploadFile(stream UploadFileChunk) returns (UploadFileResponse);
  // SearchFiles 对实例工作目录做全文搜索或文件名快速打开（FR-074，见 ADR-017）。
  // Worker 维护本地持久倒排索引（var/index/，增量更新），查询返回命中文件+行+片段。
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
  // ListArchiveEntries 列出归档（jar/zip）内全部条目（Go archive/zip，不起进程；FR-075，见 ADR-018）。
  rpc ListArchiveEntries(ListArchiveEntriesRequest) returns (ListArchiveEntriesResponse);
  // ReadArchiveEntry 读取归档内某条目内容，流式截断到上限（FR-075）。
  rpc ReadArchiveEntry(ReadArchiveEntryRequest) returns (ReadArchiveEntryResponse);
  // DecompileClass 经实例/系统 JDK 跑 CFR 反编译工作目录内 class/jar（或归档内某 class）为 Java 源码（FR-075，见 ADR-018）。
  rpc DecompileClass(DecompileClassRequest) returns (DecompileClassResponse);
  // ListConfigFiles 列出可管理配置文件。
  rpc ListConfigFiles(ListConfigFilesRequest) returns (ListConfigFilesResponse);
  // ReadConfig 读取配置文件并解析。
  rpc ReadConfig(ReadConfigRequest) returns (ReadConfigResponse);
  // WriteConfig 写入配置文件。
  rpc WriteConfig(WriteConfigRequest) returns (WriteConfigResponse);
  // ValidateConfig 校验配置内容。
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  // GetNodeMetrics 获取节点指标。
  rpc GetNodeMetrics(GetNodeMetricsRequest) returns (GetNodeMetricsResponse);
  // GetInstanceMetrics 获取实例指标。
  rpc GetInstanceMetrics(GetInstanceMetricsRequest) returns (GetInstanceMetricsResponse);
  // GetInstanceEnv 获取运行中实例 JVM 进程的实际环境（FR-344 环境变量下区）。
  rpc GetInstanceEnv(GetInstanceEnvRequest) returns (GetInstanceEnvResponse);

  // === JDK 管理 ===

  // ListJDKs 列出 Worker 本地已注册/探测到的 JDK 目录。
  rpc ListJDKs(ListJDKsRequest) returns (ListJDKsResponse);
  // InstallJDK 下载并安装指定 JDK 到 Worker 托管目录。
  rpc InstallJDK(InstallJDKRequest) returns (InstallJDKResponse);
  // RemoveJDK 删除 Worker 托管的 JDK 目录。
  rpc RemoveJDK(RemoveJDKRequest) returns (RemoveJDKResponse);
  // JDKCatalog 经 foojay disco API 查询某发行版可选的具体 JDK 版本，喂前端版本选择器（FR-178）。
  rpc JDKCatalog(JDKCatalogRequest) returns (JDKCatalogResponse);
  // ProbeJDK 探测节点上某路径（JDK home 或 java 可执行文件）的 JDK 厂商/版本/架构，供登记自动填（FR-228）。
  rpc ProbeJDK(ProbeJDKRequest) returns (ProbeJDKResponse);
  // ScanRuntimes 扫描节点常见安装路径发现运行时候选（jdk/nodejs，FR-298 节点运行时库）。
  // 路径不存在/探测失败静默跳过，不阻断整体扫描；托管根下的候选标 already_registered。
  rpc ScanRuntimes(ScanRuntimesRequest) returns (ScanRuntimesResponse);
  // InstallRuntime 下载并安装指定运行时到 Worker 托管目录（首批 nodejs，FR-299）。
  // 携带 task_id 异步执行（语义同 InstallJDK/FR-183）：启动即返回，进度/日志/终态经心跳上报。
  rpc InstallRuntime(InstallRuntimeRequest) returns (InstallRuntimeResponse);
  // RemoveRuntime 删除 Worker 托管的运行时目录（FR-299，删除顶层清理语义同 RemoveJDK/FR-292）。
  rpc RemoveRuntime(RemoveRuntimeRequest) returns (RemoveRuntimeResponse);
  // GetPMConfig 读取节点包管理器与 registry 配置（FR-306）：当前 PM 偏好、corepack 可用性、
  // 已激活 PM 版本、托管 .npmrc 现有 registry。
  rpc GetPMConfig(GetPMConfigRequest) returns (GetPMConfigResponse);
  // SetPMConfig 设置 PM 偏好（pnpm/yarn 经 corepack enable 激活）并写托管 .npmrc（FR-306）。
  rpc SetPMConfig(SetPMConfigRequest) returns (SetPMConfigResponse);
  // ListGlobalPackages 列出托管全局目录下已装包（FR-307；含 outdated 可更新标记，best-effort）。
  rpc ListGlobalPackages(ListGlobalPackagesRequest) returns (ListGlobalPackagesResponse);
  // InstallGlobalPackage 安装/升级全局包（FR-307；task_id 必填走任务中心异步，版本空=latest，
  // 升级=对已装包再装 @latest）。
  rpc InstallGlobalPackage(InstallGlobalPackageRequest) returns (InstallGlobalPackageResponse);
  // RemoveGlobalPackage 卸载全局包（FR-307，同步）。
  rpc RemoveGlobalPackage(RemoveGlobalPackageRequest) returns (RemoveGlobalPackageResponse);
  // DownloadCore 下载服务端核心 jar 到实例工作目录（FR-034 一键开服）。
  // 先查节点核心缓存（FR-178 sha256 键 / FR-330 组合键），命中免远程下载。
  rpc DownloadCore(DownloadCoreRequest) returns (DownloadCoreResponse);
  // InstallForgeServer 安装 Forge 服务端并部署 SpongeForge mod（FR-046）。
  rpc InstallForgeServer(InstallForgeServerRequest) returns (InstallForgeServerResponse);

  // === 节点制品缓存（FR-178）===
  //
  // Worker 按 sha256 缓存下载过的服务端核心 jar（建实例命中即秒拷免重下）。
  // 缓存管理（列/逐项清/清空/容量上限）经以下 RPC，CP 仅平台管理员可达。

  // ListArtifactCache 列出节点本地制品缓存项 + 总占用 + 当前容量上限。
  rpc ListArtifactCache(ListArtifactCacheRequest) returns (ListArtifactCacheResponse);
  // EvictArtifactCache 逐项清除指定 sha256 的缓存。
  rpc EvictArtifactCache(EvictArtifactCacheRequest) returns (EvictArtifactCacheResponse);
  // ClearArtifactCache 清空节点全部制品缓存。
  rpc ClearArtifactCache(ClearArtifactCacheRequest) returns (ClearArtifactCacheResponse);
  // SetArtifactCacheCap 设置容量上限（字节，0=不限）；超限按 lastUsedAt 升序 LRU 淘汰。
  rpc SetArtifactCacheCap(SetArtifactCacheCapRequest) returns (SetArtifactCacheCapResponse);

  // === 节点目录浏览（FR-178，JDK 路径登记目录选择器）===

  // BrowseDir 只读列出节点上某绝对路径下的子目录（防穿越，CP 仅平台管理员可达）。
  rpc BrowseDir(BrowseDirRequest) returns (BrowseDirResponse);
  // DeployServerProbe 部署 ServerProbe 监控探针 jar 与 config 到实例 plugins 目录（FR-010）。
  rpc DeployServerProbe(DeployServerProbeRequest) returns (DeployServerProbeResponse);
  // CloneWorkDir 复制源实例工作目录到目标实例工作目录，排除运行态文件（FR-036 一键复制）。
  rpc CloneWorkDir(CloneWorkDirRequest) returns (CloneWorkDirResponse);
  // RemoveInstance 移除实例注册并删除其工作目录与派生索引（CP 删除实例时真清理，兑现「所有数据将被删除」）。
  rpc RemoveInstance(RemoveInstanceRequest) returns (RemoveInstanceResponse);

  // === Docker 镜像管理（FR-078，见 ADR-019）===

  // ListImages 列出 Worker 本机 Docker 镜像。
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  // PullImage 从 registry 拉取镜像到 Worker 本机（建实例选镜像前置）。
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  // RemoveImage 删除 Worker 本机 Docker 镜像。
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);

  // === 备份操作（FR-013 全量 / FR-056 增量 / FR-057 远程存储） ===

  // CreateBackup 将实例工作目录打包为 tar.gz 落到节点数据根 var/backups/。
  // 增量备份据 base_manifest 仅打包新增/变化文件；可选上传到远程存储后端。
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  // RestoreBackup 按备份链顺序（全量基 + 各增量）回放归档到实例工作目录；
  // 远程归档先据 storage 拉回本地再回放。
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  // TestStorageBackend 对远程备份存储做一次非破坏性读写删除探测（FR-152）。
  rpc TestStorageBackend(TestStorageBackendRequest) returns (TestStorageBackendResponse);

  // === Bot 操作 ===

  // CreateBot 在 Worker 上创建 Bot 连接。
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse);
  // DeleteBot 停止并删除 Bot。
  rpc DeleteBot(DeleteBotRequest) returns (DeleteBotResponse);
  // ListBots 列出 Worker 上所有 Bot。
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  // SetBotBehavior 切换 Bot 行为模式。
  rpc SetBotBehavior(SetBotBehaviorRequest) returns (SetBotBehaviorResponse);
  // SendBotCommand 向 Bot 发送命令。
  rpc SendBotCommand(SendBotCommandRequest) returns (SendBotCommandResponse);
  // RunBotScript 在指定 Bot 上执行脚本。
  rpc RunBotScript(RunBotScriptRequest) returns (RunBotScriptResponse);
  // StreamBotEvents 订阅 Bot 事件流。
  rpc StreamBotEvents(StreamBotEventsRequest) returns (stream BotEvent);
  // GetBotCapacity 返回本节点 Bot Worker 的 fleet 准入容量快照（FR-351）。
  rpc GetBotCapacity(GetBotCapacityRequest) returns (GetBotCapacityResponse);
  // ApplyBotBatch 批量应用最多 50 个 Bot assignment，并返回逐项回执（FR-351）。
  rpc ApplyBotBatch(ApplyBotBatchRequest) returns (ApplyBotBatchResponse);
  // GetBotFleetSnapshot 返回当前 Bot fleet 运行快照（FR-351，供后续 reconcile 建基线）。
  rpc GetBotFleetSnapshot(GetBotFleetSnapshotRequest) returns (GetBotFleetSnapshotResponse);
  // StreamBotFleetEvents 以类型化流持续上报 runtime/action 事件（FR-351）。
  rpc StreamBotFleetEvents(StreamBotFleetEventsRequest) returns (stream BotFleetEvent);
  // SignalBotActions 批量投递最多 100 个外部动作信号，并返回逐项回执（FR-351）。
  rpc SignalBotActions(SignalBotActionsRequest) returns (SignalBotActionsResponse);

  // === 插件桥（ServerProbe 反向 WS ↔ Worker，FR-065，见 ADR-016）===
  //
  // 一次铺齐桥的全面：下游 FR-066（玩家事件）/FR-067（治理迁移+退 RCON）/FR-068（在线更新）
  // 复用以下 RPC 与 message，不再改 proto。地基（FR-065）仅真实使用 StreamPluginEvents
  // 的 connected/disconnected/heartbeat；其余事件子类型与命令/状态查询为骨架，语义留下游填充。

  // StreamPluginEvents 订阅某实例（或全部）探针经反向 WS 上报的事件流（connected/disconnected/玩家事件…）。
  rpc StreamPluginEvents(StreamPluginEventsRequest) returns (stream PluginEvent);
  // SendPluginCommand CP 经 Worker 向探针下发治理/查询指令（踢/封/白名单/在线列表…）。
  rpc SendPluginCommand(SendPluginCommandRequest) returns (SendPluginCommandResponse);
  // QueryServerState 查询子服全状态（在线列表/世界/TPS 等聚合），骨架，语义留下游。
  rpc QueryServerState(QueryServerStateRequest) returns (QueryServerStateResponse);

  // === 面板自更新（FR-081，见 ADR-020 §4）===

  // GetVersion 返回 Worker 当前版本与平台信息，供 CP 自更新检查比对。
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  // CheckDocker 探测本机 Docker 守护进程是否可用（FR-237）：返回可用性 + 版本 + 错误，
  // 供创建向导选 docker 模式前先测、不可用即禁用提示（与 FR-229 连通性族同范式）。
  rpc CheckDocker(CheckDockerRequest) returns (CheckDockerResponse);
  // UpgradeWorker 令 Worker 下载指定二进制 → sha256 校验 → 替换自身 → 计划重启。
  // daemon 模式下不杀游戏服（ADR-003 wrapper 子进程与 Worker 主进程隔离，
  // Worker 重启后 RecoverDaemonInstances 经 PID 文件重连存活 wrapper）。
  // action="rollback" 时改为回滚本地升级前备份（FR-182，见 ADR-042），不下载。
  rpc UpgradeWorker(UpgradeWorkerRequest) returns (UpgradeWorkerResponse);

  // === 终端会话隧道桥（FR-281 M2，见 ADR-066）===

  // TerminalSession 把 CP 侧终端代理（浏览器 ⇄ CP /ws/terminal）的 WS 帧经 gRPC 双向流
  // 转发给 Worker：首帧必须为 open（携带一次性终端令牌），Worker 在本机回环拨自身 WS
  // 终端服务并原样泵帧——令牌校验方仍是 Worker（ADR-061 信任模型不变），会话层零复制。
  // 经反向隧道承载时 CP→Worker 终端零入站；老 Worker 无本方法（Unimplemented）时 CP
  // 回退直拨 Worker WS（双模式，与指令通道一致）。
  rpc TerminalSession(stream TerminalFrame) returns (stream TerminalFrame);

  // === 导入现有服务器（FR-302，见 ADR-069）===

  // InspectServerDir 只读探测节点上某现成服务器目录：核心 jar 候选（深度≤2，已知核心名排前，
  // MANIFEST Main-Class 仅作排序提示）、内嵌 JDK 候选（jre*/jdk*/runtime/java 子目录）、
  // server.properties 端口与 eula 状态。守卫：路径必须绝对/存在/目录，且不得指向托管区之内。
  rpc InspectServerDir(InspectServerDirRequest) returns (InspectServerDirResponse);
  // ImportServerDir 导入现成目录：migrate 模式把目录整体搬进托管区系统分配目录
  // （同盘 os.Rename 优先，跨盘递归拷贝 + 数量/字节校验 + 清源）；in_place 模式 no-op 回原路径。
  rpc ImportServerDir(ImportServerDirRequest) returns (ImportServerDirResponse);
}

// === 注册 ===

message RegisterRequest {
  string name = 1;
  string host = 2;
  int32 grpc_port = 3;
  int32 ws_port = 4;
  string os = 5;
  string arch = 6;
  int32 cpu_cores = 7;
  int64 memory_mb = 8;
  int64 disk_total_mb = 9;
}

message RegisterResponse {
  string node_uuid = 1;
  string node_secret = 2;
  // CP↔Worker WS 令牌密钥（FR-275，见 ADR-061）：只签终端/插件桥令牌，与用户会话密钥隔离。
  // 首注册与重注册均下发；Worker 持久化到 etc/node-identity.json 并热应用到 WS 校验。
  // 空 = 旧 CP 未下发，Worker 回退本地 jwt_secret 配置（向后兼容）。
  string ws_token_secret = 3;
}

// === 崩溃快照上报（FR-313，CP 侧实现）===

// ReportCrashSnapshotRequest 一条实例崩溃快照：进程非正常退出的现场留存。
message ReportCrashSnapshotRequest {
  string node_uuid = 1;          // 节点身份（与 FetchBotWorkerArchive 同源校验）
  string node_secret = 2;
  string instance_uuid = 3;      // 崩溃实例（须属于该节点）
  int64 occurred_at_unix_ms = 4; // 崩溃发生时刻（Unix 毫秒）
  int32 exit_code = 5;           // 进程退出码；无法获知（如容器 Wait 出错）为 -1
  string signal = 6;             // 终止信号名（Unix，如 killed）；Windows / 非信号退出留空
  int64 duration_ms = 7;         // 本次运行时长（毫秒）
  string tail_output = 8;        // 崩溃前终端尾部输出（Worker 侧截取，≤200 行 / 64KB）
}

// ReportCrashSnapshotResponse 无负载确认（语义等价 Empty，遵循本 proto 的 Request/Response 命名惯例）。
message ReportCrashSnapshotResponse {
}

// === 心跳 ===

// bot-worker dist 自愈下发（FR-308，CP 侧实现；见 ADR-070）。
message FetchBotWorkerArchiveRequest {
  string node_uuid = 1;   // 节点身份（与重注册同源校验）
  string node_secret = 2;
  string known_sha256 = 3; // 本地已有 dist 的清单指纹（空=本地无）
}

message FetchBotWorkerArchiveResponse {
  bool success = 1;
  string error = 2;      // CP 未内嵌 bot-worker 时明确说明
  string sha256 = 3;     // 当前内嵌归档指纹
  string version = 4;    // 构建版本（同 CP version）
  bytes archive = 5;     // tar.gz 字节；known_sha256 已一致时为空（跳过重拉）
}

message HeartbeatRequest {
  string node_uuid = 1;
  float cpu_usage = 2;
  float memory_usage = 3;
  float disk_usage = 4;
  int64 memory_used_mb = 5;
  int64 disk_used_mb = 6;
  repeated InstanceState instances = 7;  // 实例状态快照
  int64 network_bytes_sent = 8;  // 累计网络发送字节
  int64 network_bytes_recv = 9;  // 累计网络接收字节
  repeated InstanceMetricSample instance_metrics = 10;  // 每实例 ServerProbe 快照（FR-060 时序）
  double load_avg1 = 11;  // 节点 1 分钟 load average（FR-062；gopsutil 跨平台，取不到为 0）
  repeated TaskSnapshot tasks = 12;  // 运行中长任务进度快照（FR-183 任务中心，见 ADR-040）
  repeated ProcessMetricSample process_metrics = 13; // 受管实例进程 TOPN 快照（FR-170）
}

// TaskSnapshot 心跳负载里携带的一条运行中长任务进度快照（FR-183，见 ADR-040）。
// Worker 维护运行中任务内存登记表，每次心跳把表内任务快照随心跳上报；
// CP 据 task_id upsert Task、幂等追加日志，终态（succeeded/failed）触发副作用。
message TaskSnapshot {
  string task_id = 1;             // 业务唯一键（UUID），CP 据此 upsert
  string state = 2;               // pending/running/succeeded/failed
  int32 progress = 3;             // 0~100
  string error = 4;               // 失败原因（仅 failed）
  string result = 5;              // 成功结果 JSON（如安装出的 JDK 信息，仅 succeeded）
  repeated string recent_log_lines = 6;  // 最近若干行滚动日志（CP 幂等追加）
}

message InstanceState {
  string instance_uuid = 1;
  string state = 2; // STOPPED, STARTING, RUNNING, STOPPING, CRASHED
}

// InstanceMetricSample 心跳负载里携带的每实例 ServerProbe 指标快照（FR-060 时序留存）。
// probe_available=false 表示探针不可用（回退 RCON 或缺测），相应字段为零值。
// 复用下方 WorldMetric 承载分世界负载。
message InstanceMetricSample {
  string instance_uuid = 1;
  bool probe_available = 2;
  double tps = 3;
  double mspt_millis = 4;
  int32 players_online = 5;
  int64 heap_used_bytes = 6;
  int64 heap_max_bytes = 7;
  int32 threads = 8;
  double cpu_load = 9;        // 0~1 系统 CPU；<0 不可用
  double uptime_seconds = 10;
  repeated WorldMetric worlds = 11;
  double mspt_p95_millis = 12; // ServerProbe 最近 60 秒原始 Tick 时长 p95；老探针缺失时为零值并由 probe_available/上层缺测语义判定
}

// ProcessMetricSample 受管实例进程 TOPN 快照（FR-170）。
message ProcessMetricSample {
  string instance_uuid = 1;
  int32 pid = 2;
  string name = 3;
  double cpu_percent = 4;
  uint64 rss_bytes = 5;
  uint64 read_bytes_per_sec = 6;
  uint64 write_bytes_per_sec = 7;
  string user = 8;
  string command_summary = 9;
  int64 sampled_at_unix_ms = 10;
}

message HeartbeatResponse {
  int64 timestamp = 1;
  // 节点期望出站代理（FR-185，见 ADR-043）：CP 据「节点 custom ? 节点值 : 全局默认」每拍下发。
  // Worker 仅当 proxy_generation 与本地已应用代不同时才重建出站 client（避免每拍重建）；
  // 重连/重启天然由后续心跳重发。proxy_url 空 = 期望直连（回退 worker.yml/env）。
  string proxy_url = 2;        // 期望代理地址（scheme://host[:port]，可能含凭据，Worker 直接用、日志脱敏）
  string proxy_no_proxy = 3;   // 期望免代理列表（逗号分隔，语义同 NO_PROXY）
  string proxy_generation = 4; // 期望代理配置的哈希；变化才触发 Worker 重建出站 client
  // cancel_task_ids 是 CP 请求中断的运行中长任务 id（FR-227）：CP 每拍把该节点「已请求取消
  // 且未终态」的任务 id 下发，Worker 据此取消对应任务的执行 context（真中断下载 + 清理临时文件）
  // 并经下一拍心跳上报该任务为 canceled。幂等：Worker 对已不在登记表的 id 静默忽略。
  repeated string cancel_task_ids = 5;
  // CP↔Worker WS 令牌密钥每拍携带（FR-275，见 ADR-061，镜像 proxy 下发）：Worker 比对
  // 与当前生效值不同才热应用 + 持久化——CP 轮换密钥后 Worker 不重启即自愈（≤1 心跳周期）。
  // 空 = 旧 CP 未下发，Worker 不动作。
  string ws_token_secret = 6;
}

// === 实例操作 ===

message CreateInstanceRequest {
  string instance_uuid = 1;
  string name = 2;
  string type = 3;
  string process_type = 4;
  string start_command = 5;
  string work_dir = 6;
  map<string, string> env_vars = 7;
  bool auto_restart = 8;
  // 绑定到 Worker 本地 JDK 路径（CP 解析 NodeJDK.Path 后下发），非空时
  // Worker 启动实例时把它作为 JAVA_HOME 并把 bin 接入 PATH。
  string jdk_path = 9;
  // 显式指定 JDK bin 目录，覆盖默认的 jdk_path/bin。
  string jdk_bin_path = 10;
  // 优雅停止命令：daemon 模式优雅关服时写入进程 stdin 的命令（不含换行）。
  // CP 按实例角色派生（MC 后端 stop / 代理 end）；为空时 Worker 回退到 "stop"。
  string stop_command = 11;
  // probe_port 是 ServerProbe /metrics 端口（CP 分配后下发），Worker 持久化到 PID 记录，
  // 心跳时据此自采每实例 ServerProbe 快照（FR-060 时序）；0=未部署探针，心跳不采该实例。
  int32 probe_port = 12;
  // graceful_stop_timeout_seconds 是优雅停止后等待进程自行退出的上限（秒，CP 从平台设置
  // graceful_stop.timeout 取生效值后下发）。daemon 策略透传到 wrapper，停服按此值超时强杀。
  // 语义：对设置变更后「新启动」的实例生效（值在启动时定型）；0=未指定，wrapper 回退 env/默认。
  int32 graceful_stop_timeout_seconds = 13;
  // image 是 docker 模式的容器镜像引用（如 itzg/minecraft-server:latest）。
  // 仅 process_type=docker 使用；Worker 启动前若本地缺镜像则拉取（FR-078，见 ADR-019）。
  string image = 14;
  // port_mappings 是 docker 模式的容器端口↔宿主端口发布关系（宿主端口来自 FR-032 端口池）。
  // 仅 process_type=docker 使用。
  repeated PortMapping port_mappings = 15;
  // cpu_limit 是 docker 模式的 CPU 核数上限（如 1.5 表示 1.5 核），注入 HostConfig.NanoCPUs（×1e9）。
  // 仅 process_type=docker 使用；0=不限制（FR-079，见 ADR-019）。
  double cpu_limit = 16;
  // mem_limit_mb 是 docker 模式的内存上限（MiB），注入 HostConfig.Memory（×1024×1024）。
  // 仅 process_type=docker 使用；0=不限制（FR-079，见 ADR-019）。
  int64 mem_limit_mb = 17;
  // disk_limit_mb 是 docker 模式的磁盘上限（MiB），仅持久化与展示，v1 不注入。
  // bind-mount 工作目录无法用 HostConfig 简单施加磁盘配额（依赖存储驱动），留作前向兼容（FR-079）。
  int64 disk_limit_mb = 18;
}

// PortMapping 描述一条容器端口到宿主端口的发布关系（docker 模式，ADR-019）。
message PortMapping {
  int32 container_port = 1; // 容器内监听端口（由镜像约定，如 MC 容器内 25565）
  int32 host_port = 2;      // 宿主发布端口（来自 FR-032 端口池）
  string protocol = 3;      // tcp（默认）或 udp（如 MC query）
}

message CreateInstanceResponse {
  bool success = 1;
  string error = 2;
}

// ResyncInstancesRequest CP 重连后重推某节点全部实例规格（见 ADR-050）。
// 复用 CreateInstanceRequest 作每实例规格——其字段已涵盖 Worker 填注册表所需的全部内容
// （uuid/name/process_type/start_command/stop_command/work_dir/env_vars/auto_restart/
// jdk_path/probe_port/graceful_stop_timeout/docker 镜像端口限额）。
message ResyncInstancesRequest {
  repeated CreateInstanceRequest instances = 1;
}

// ResyncInstancesResponse 回报本次重推中新注册（registered）与已存在跳过（skipped）的实例数。
message ResyncInstancesResponse {
  int32 registered = 1; // 本次新填入注册表（按 STOPPED）的实例数
  int32 skipped = 2;    // 已在注册表（含 RUNNING 恢复实例）被跳过的实例数
}

message InstanceActionRequest {
  string instance_uuid = 1;
}

message InstanceActionResponse {
  bool success = 1;
  string error = 2;
}

message SendCommandRequest {
  string instance_uuid = 1;
  string command = 2;
}

message SendCommandResponse {
  bool success = 1;
  string error = 2;
}

message GetInstanceStatusResponse {
  string instance_uuid = 1;
  string state = 2; // STOPPED, STARTING, RUNNING, STOPPING, CRASHED
}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated InstanceInfo instances = 1;
}

message InstanceInfo {
  string instance_uuid = 1;
  string name = 2;
  string state = 3;
  string type = 4;
  int64 started_at = 5;
  int32 pid = 6;
}

// === 实例事件流 ===

message StreamInstanceEventsRequest {
  string instance_uuid = 1; // 空表示所有实例
}

message InstanceEvent {
  string instance_uuid = 1;
  string type = 2; // stdout, stderr, state_change
  string data = 3;
  int64 timestamp = 4;
}

// === 终端 ===

message IssueTerminalTokenRequest {
  string instance_uuid = 1;
  string permission = 2; // read, write
}

message IssueTerminalTokenResponse {
  string token = 1;
  string ws_url = 2;
  int32 expires_in = 3;
}

// === 文件操作 ===

message ListFilesRequest {
  string instance_uuid = 1;
  string path = 2;
}

message ListFilesResponse {
  repeated FileInfo files = 1;
}

message FileInfo {
  string name = 1;
  bool is_dir = 2;
  int64 size = 3;
  int64 mod_time = 4;
  // FR-373 权限元数据（加性；相对 Worker 进程用户）。
  string mode_octal = 5;   // 如 "0644"，Windows 可空
  string mode_string = 6;  // 如 "rw-r--r--"，Windows 可空
  bool readable = 7;
  bool writable = 8;
  string owner = 9;        // 可空
  string group = 10;       // 可空
}

// CheckPathAccessRequest 写前/浏览前权限探测（FR-373）。
message CheckPathAccessRequest {
  string instance_uuid = 1; // 空=节点绝对路径模式
  string path = 2;
}

message CheckPathAccessResponse {
  bool success = 1;
  string error = 2;
  bool exists = 3;
  bool is_dir = 4;
  bool readable = 5;
  bool writable = 6;
  string mode_octal = 7;
  string mode_string = 8;
  string owner = 9;
  string group = 10;
  string reason = 11; // 中文诊断
}

// ChmodPathRequest 单 path 非递归 chmod（FR-373）。
message ChmodPathRequest {
  string instance_uuid = 1;
  string path = 2;
  string mode = 3; // 可选八进制如 "0644"；空=保证 u+rw（目录 u+rwx）
}

message ChmodPathResponse {
  bool success = 1;
  string error = 2;
  string mode_octal = 3; // 修改后
}

message ReadFileRequest {
  string instance_uuid = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message WriteFileRequest {
  string instance_uuid = 1;
  string path = 2;
  bytes content = 3;
}

message WriteFileResponse {
  bool success = 1;
  string error = 2;
}

message DeleteFileRequest {
  string instance_uuid = 1;
  string path = 2;
}

message DeleteFileResponse {
  bool success = 1;
  string error = 2;
}

message RenameFileRequest {
  string instance_uuid = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameFileResponse {
  bool success = 1;
  string error = 2;
}

message DownloadArchiveRequest {
  string instance_uuid = 1;
  repeated string paths = 2; // 相对工作目录的文件/目录集合，目录递归打包
}

message DownloadArchiveChunk {
  bytes content = 1; // zip 字节分片
}

message DownloadFileRequest {
  string instance_uuid = 1;
  string path = 2; // 相对工作目录的单个文件路径
}

message DownloadFileChunk {
  bytes content = 1;    // 文件原样字节分片
  int64 total_size = 2; // 仅首帧携带：文件总字节数，供 CP 设置 Content-Length；后续帧为 0
}

message UploadFileChunk {
  string instance_uuid = 1; // 仅首帧有效
  string path = 2;          // 仅首帧有效，相对工作目录的目标文件路径
  bytes content = 3;        // 文件字节分片（首帧可携带）
}

message UploadFileResponse {
  bool success = 1;
  string error = 2;
  int64 bytes_written = 3; // 实际落盘字节数，CP 与已发送字节数比对校验完整性
}

// === 全文搜索 / 文件名快速打开（FR-074，见 ADR-017）===

message SearchFilesRequest {
  string instance_uuid = 1;
  string query = 2;        // 关键字（content 模式按词项/子串、filename 模式按路径/basename 子串）
  string mode = 3;         // content（全文，默认）| filename（文件名快速打开）
  int32 max_results = 4;   // 命中上限（<=0 时 Worker 取默认 200）
}

// SearchHit 单条命中：content 模式含行号与该行片段；filename 模式 line=0、snippet 为空。
message SearchHit {
  string path = 1;   // 相对实例工作目录、以「/」分隔的可移植路径
  int32 line = 2;    // 命中行号（1 起；filename 模式为 0）
  string snippet = 3; // 命中行内容（已截断，仅 content 模式）
}

message SearchFilesResponse {
  repeated SearchHit hits = 1;
  bool truncated = 2;  // 命中数达到 max_results 上限被截断
  bool indexing = 3;   // 索引首建未就绪：本次返回空命中，调用方应稍后用同一查询重试（FR-113，ADR-024）
}

// === 配置文件操作 ===

message ListConfigFilesRequest {
  string instance_uuid = 1;
  string path = 2;
