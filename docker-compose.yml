# JianManager 本地 Compose（FR-354）：CP + 一个 Worker
# 环境变量须与 Worker BindEnv 一致：JIANMANAGER_CONTROL_PLANE_GRPC / JIANMANAGER_NODE_NAME

services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    ports:
      - "8080:8080"   # HTTP API + 前端
      - "9100:9100"   # gRPC
    environment:
      - JIANMANAGER_SERVER_PORT=8080
      - JIANMANAGER_GRPC_PORT=9100
      - JIANMANAGER_DATABASE_DRIVER=sqlite
      - JIANMANAGER_DATABASE_DSN=/app/data/jianmanager.db
      - JIANMANAGER_JWT_SECRET=${JIANMANAGER_JWT_SECRET:-dev-secret-change-me}
      # CP↔Worker WS 令牌密钥（FR-275，见 ADR-061）：留空=生产自动生成持久化 + 注册自动下发 Worker
      - JIANMANAGER_JWT_WS_SECRET=${JIANMANAGER_JWT_WS_SECRET:-}
    volumes:
      - cp-data:/app/data

  worker-01:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      # 线上/本地 compose 唯一 main Worker 节点名
      - JIANMANAGER_NODE_NAME=main
      - JIANMANAGER_CONTROL_PLANE_GRPC=control-plane:9100
      - JIANMANAGER_WS_PORT=9102
      - JIANMANAGER_DATA_DIR=/app/data
      - JIANMANAGER_ENROLL_TOKEN=${JIANMANAGER_ENROLL_TOKEN:-}
    volumes:
      - worker-01-data:/app/data
    depends_on:
      - control-plane

volumes:
  cp-data:
  worker-01-data:
