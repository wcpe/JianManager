# JianManager — worker 配置样例
# 配置由 Worker 启动时真正加载（FR-080，见 ADR-020）；JIANMANAGER_ 前缀环境变量按路径覆盖。
name: node-01
control_plane: localhost:9100
node_secret: ${JIANMANAGER_NODE_SECRET}

# 注册上报给 CP 的本机地址（供 CP 反向连接）；留空自动探测出口 IP。
# host: ""

# WS 终端 / 插件桥 token 校验密钥。新版 CP 在注册/心跳时自动下发专用密钥并持久化到
# <data_dir>/etc/node-identity.json（FR-275，见 ADR-061），其生效优先级高于本项——通常无需配置。
# 本项仅作旧 CP（< FR-275）兼容回退：届时须与 CP 的 jwt.secret 一致（生产经 JIANMANAGER_JWT_SECRET 覆盖）。
jwt_secret: dev-secret-change-me

# enrollment token（一次性节点准入凭据）绝不写入本文件——经 JIANMANAGER_ENROLL_TOKEN
# 或安装脚本命令行一次性传入；注册成功后 CP 换发的身份持久化到 <data_dir>/etc/node-identity.json。

grpc:
  port: 9101

ws:
  port: 9102

# 项目自包含数据根（FHS 式布局，见 ADR-010）。默认 ./data，可经 JIANMANAGER_DATA_DIR 覆盖。
# JDK 装入 <data_dir>/opt/jdks，服务器工作目录在 <data_dir>/var/servers，整体可迁移。
data_dir: ./data

# 兼容旧部署：显式指定时覆盖数据根派生的 var/servers；留空则用 <data_dir>/var/servers。
# servers_dir: ./servers

# 节点本地制品缓存（FR-178）：按 sha256 缓存下载过的服务端核心 jar（<data_dir>/var/artifact-cache），
# 建实例命中即秒拷免重下。max_bytes=0 不限；设上限后存入超限按 lastUsedAt 升序 LRU 淘汰。
# 也可经 CP 端点 PUT /nodes/:id/artifact-cache/cap 运行时下发覆盖。
# artifact_cache:
#   max_bytes: 0                    # 例：10737418240（10 GiB）

log:
  level: info
  format: text

# Optional localhost VictoriaLogs query client. Empty vl_url keeps the explicit
# LOG_UNSUPPORTED compatibility path until a managed VL instance is healthy.
# log_query:
#   vl_url: http://127.0.0.1:19441
#   username: jm
#   password: ${JIANMANAGER_VL_PASSWORD}

# Optional managed VL supervisor. When binary_path and asset_sha256 are set,
# Worker verifies the approved asset before starting HOT (and optional COLD/
# Rehydrate) localhost instances.
# log_vl:
#   binary_path: /home/jianmanager/opt/victoria-logs/victoria-logs-prod
#   asset_sha256: ${JIANMANAGER_VL_ASSET_SHA256}
#   username: jm
#   password: ${JIANMANAGER_VL_PASSWORD}
#   data_root: /home/jianmanager/var/log/vl
#   retention_period: 30d
#   start_cold: false
#   start_rehydrate: false

# Optional persistent Worker/Node or offline FILE_PRIMARY sources. Instance
# sources are registered automatically by CP instance lifecycle RPCs.
#
# log_source_id / storage_namespace 必须用 **node:<节点数字ID>**，不能写字面 node:self——
# CP 一律按 node:<n.ID> 派生联邦查询目标（见 logcoord/assemble.go），写成 node:self 会使
# 查询返回 target_missing_in_worker_response、日志中心空白。节点 ID 见面板「节点」页 URL 或 `GET /api/v1/nodes`。
# log_sources:
#   - log_source_id: node:1
#     source_generation: node-self-v1
#     path: /home/jianmanager/logs/worker.log
#     mode: FILE_PRIMARY
#     archive_glob: /home/jianmanager/logs/worker-*.log.gz
#     source_category: worker
#     storage_namespace: node:1

# 采集归一化的节点级默认时区（缺陷 C）：解释日志行内 [HH:MM:SS] 所用的时区。
# 留空 = UTC（既有行为零变化，未配置的节点时间轴不漂移）；local = 跟随节点进程时区
# （节点 JVM 与 Worker 同机部署时用它对齐本地日志时间）；其余按 IANA 名解析（如 Asia/Hong_Kong）。
# 实例源未显式配置时区时继承本默认；非法值**启动即拒**（时区配错会让整源时间轴静默偏移，
# 不能用回退掩盖）。环境变量覆盖：JIANMANAGER_LOG_INGEST_TIME_ZONE。
#
# ⚠ local 解析的是 **Worker 进程**的本地时区，不是「节点 JVM 的时区」：
#   - 容器（alpine 基础镜像无 /etc/localtime、无 TZ）与部分 systemd 单元（Environment=TZ=）
#     里它会解析成 UTC —— 此时「配了 local」等于什么都没配，表现为新入库条目仍是 +8h；
#   - Worker 启动日志会打印 `采集归一化节点默认时区已生效 config=local resolved=... offsetSeconds=...`，
#     若 local 解析成 UTC 会额外打一条 WARN 提示（含 TZ/ /etc/localtime 的判定依据）。
#   - 生产建议**显式写 IANA 名**（如 Asia/Hong_Kong），跨部署形态都稳定。
# log_ingest:
#   time_zone: local

# 启动增量对账（FR-497）：按「源 × UTC 天」只补缺失天；回退方向永远是「多写一次」而不是「少写一次」。
# 默认启用、并发 4、单源总超时 30s、单次 count 查询 10s、**整批总预算 60s**（复审 P2-10：对账在
# ingest.New 里同步执行，预算到期即取消在途查询，未完成的源回退整窗重发）。
# 需要「启动时一律整窗重发」时把它显式关掉（应急逃生口）。
# log_reconcile:
#   enabled: true
#   concurrency: 4
#   timeout: 30s
#   query_timeout: 10s
#   budget: 60s

# 采集归一化的节点级默认字符集（复审 P2-3）：源未显式配置 Charset 时继承本默认。
# 留空 = auto（合法 UTF-8 原样返回；非法 UTF-8 才按 GB18030 解码并做「含替换字符即放弃」的
# 可靠性判定）；utf-8 / gbk / gb18030 则强制按该字符集解码。
# 中文 locale 的 JVM 与 Worker 同机部署、日志为 GBK 时配 gbk 最稳（显式声明优于启发式判定）。
# 非法值**启动即拒**（回退 auto 会让中文被当作非法 UTF-8 净化成替换字符，正文静默损坏）。
# 环境变量覆盖：JIANMANAGER_LOG_INGEST_CHARSET。
# log_ingest:
#   charset: gbk

# 出站网络代理（FR-174，见 ADR-037；可视化配置 + CP 下发见 FR-185 / ADR-043）。本节点所有出站
# 下载（自更新二进制、JDK 归档、CFR 反编译器、服务端 jar）经此代理。url 留空=直连（仍尊重
# HTTP_PROXY/HTTPS_PROXY/NO_PROXY 环境变量），不破坏现状；非空时优先于环境变量。
# scheme 决定类型：http:// / https:// / socks5://。含凭据时经 ${ENV} 注入、勿硬编码。
# 也可在面板「节点页 → 代理」为本节点配「继承全局 / 自定义」，经心跳下发、运行时生效（无需改本文件/重启）；
# 节点出站优先级：节点自定义（DB 下发） > 全局默认（DB 下发） > worker.yml > 环境变量。
# proxy:
#   url: ""                       # 例：http://127.0.0.1:7890 或 socks5://user:${PROXY_PASS}@127.0.0.1:1080
#   no_proxy: ""                  # 逗号分隔免代理：localhost,127.0.0.1,10.0.0.0/8,.internal.example
