# JianManager — worker 配置样例
# 配置由 Worker 启动时真正加载；JIANMANAGER_ 前缀环境变量按路径覆盖。
name: node-01
control_plane: localhost:9100
node_secret: ${JIANMANAGER_NODE_SECRET}

# 注册上报给 CP 的本机地址（供 CP 反向连接）；留空自动探测出口 IP。
# host: ""

# WS 终端 / 插件桥 token 校验密钥。新版 CP 在注册/心跳时自动下发专用密钥并持久化到
# <data_dir>/etc/node-identity.json，其生效优先级高于本项——通常无需配置。
# 本项仅作旧 CP（不下发专用密钥的版本）兼容回退：届时须与 CP 的 jwt.secret 一致（生产经 JIANMANAGER_JWT_SECRET 覆盖）。
jwt_secret: dev-secret-change-me

# enrollment token（一次性节点准入凭据）绝不写入本文件——经 JIANMANAGER_ENROLL_TOKEN
# 或安装脚本命令行一次性传入；注册成功后 CP 换发的身份持久化到 <data_dir>/etc/node-identity.json。

grpc:
  port: 9101

ws:
  port: 9102

# 项目自包含数据根（FHS 式布局）。默认 ./data，可经 JIANMANAGER_DATA_DIR 覆盖。
# JDK 装入 <data_dir>/opt/jdks，服务器工作目录在 <data_dir>/var/servers，整体可迁移。
data_dir: ./data

# 兼容旧部署：显式指定时覆盖数据根派生的 var/servers；留空则用 <data_dir>/var/servers。
# servers_dir: ./servers

# 节点本地制品缓存：按 sha256 缓存下载过的服务端核心 jar（<data_dir>/var/artifact-cache），
# 建实例命中即秒拷免重下。max_bytes=0 不限；设上限后存入超限按 lastUsedAt 升序 LRU 淘汰。
# 也可经 CP 端点 PUT /nodes/:id/artifact-cache/cap 运行时下发覆盖。
# artifact_cache:
#   max_bytes: 0                    # 例：10737418240（10 GiB）

log:
  level: info
  format: text
  # 互斥锁争用采样率（诊断用，0=关闭）。此前该旋钮只认环境变量
  # JM_MUTEX_PROFILE_FRACTION，绕过配置体系 ⇒ 运维无从从配置面发现它。
  # 1 = 全采（诊断窗口），数值越大采样越稀（5 = 1/5），0 = 关闭（默认）。
  # mutex_profile_fraction: 0

  # 进程自身日志文件（<数据根>/var/log/worker.log）的轮转与保留，
  # 与实例日志 / VictoriaLogs 完全无关。零值回退内置默认（1 GiB / 5 份 / 30 天 / 压缩），
  # 旧配置无需改动。
  #
  # max_size_mb: 1024      # 单文件触发轮转的大小（MB）
  # max_backups: 5         # 保留份数（含未压缩与已压缩）；负值 = 不限
  # max_age_days: 30       # 保留天数（按档名里的轮转时间算，一天 = 24h）；负值 = 关闭按天保留
  # compress: true         # 轮转档是否 gzip；显式写 false 才关

# Optional localhost VictoriaLogs query client. Empty vl_url keeps the explicit
# LOG_UNSUPPORTED compatibility path until a managed VL instance is healthy.
# log_query:
#   vl_url: http://127.0.0.1:19441
#   username: jm
#   password: ${JIANMANAGER_VL_PASSWORD}

# Optional managed VL supervisor. When binary_path and asset_sha256 are set,
# Worker verifies the approved asset before starting HOT (and optional COLD/
# Rehydrate) localhost instances.
# log_vl:
#   binary_path: /home/jianmanager/opt/victoria-logs/victoria-logs-prod
#   asset_sha256: ${JIANMANAGER_VL_ASSET_SHA256}
#   username: jm
#   password: ${JIANMANAGER_VL_PASSWORD}
#   data_root: /home/jianmanager/var/log/vl
#   retention_period: 180d       # 唯一的保留期（既管可查窗口也管长期留存）。
#                                # ⚠ 必须 **不短于** log_retention 声明的 max(hot_retention, cold_retention)；
#                                # 否则 Load 在启动受管进程之前就 **拒绝启动**（不是告警）。
#                                # 默认值：retention_period=180d、hot_retention=90d、cold_retention=180d
#                                # ⇒ max(90d,180d)=180d，与 180d 相等，默认就能启动。
#                                # ℹ 若只改 `log_vl.retention_period` 而不改 cold_retention，
#                                # 只要新值 >= 180d（默认 cold）依然合法；改小则必被拒。
#                                # ℹ 冷热双层已废除（2026-10-29），`cold_retention` 现在只是**声明**，
#                                # 它是 retention_period 的下界，本身不执行任何淘汰。
#                                # 2026-10-29：冷热双层已废除，只剩余一个 VL；`cold_retention_period`
#                                # / `cold_port` / `rehydrate_port` / `start_cold` / `start_rehydrate`
#                                # 均已删除，写了也不会生效。
#
#   # ── 磁盘占用上限（2026-10-29）───────────────────────────────────────────
#   # 只有 retention_period 时，磁盘用量 = 保留期 × 实际写入量，**没有上限**：
#   # 某个源日志暴增就会把磁盘拖涨。下列**两选一**（同时配会在启动时报错）：
#   #
#   # max_disk_space_bytes：按绝对字节数（**推荐**，尤其 VL 与其它进程共享盘时）。
#   # max_disk_usage_percent：按磁盘使用百分比 1-100。
#   #   ⚠ 百分比口径在**共享盘**上会被其它进程的写入触发（比如游戏服自己在写），
#   #     结果是把日志丢掉而不是删别的 ⇒ 只在 VL 独占一块盘时才是好口径。
#   #
#   # 两者与 retention_period **同时生效**（谁先到谁触发），不是替代关系：
#   # 日志量稳定时满保留期才淘汰；暴涨时先撞磁盘上限、旧分区提前丢。
#   # VL 的行为是**丢最旧的按日分区**，不是按字节精确切。
#   #
#   # ⚠ 两条官方限制（2026-10-29 实读文档），它们决定了「上限 != 沙盘」：
#   #   1. VL **至少保留最近 2 天**：最近 2 天数据超过上限时，占用**必然**超过阈值；
#   #   2. 占用检查是**周期性**的，两次检查之间可以涨穿；而磁盘写满时 VL 会进入
#   #      **只读模式、反而无法执行丢弃**（丢弃也要写元数据）。
#   # ⇒ 上限必须**远低于**可用空间（建议 <= 可用量的 40%），并配 disk_full 告警。
#   #
#   # 配套告警（代码已打通读数，规则需在 CP 面板/API 建）：
#   #   log_vl_disk_pct      >= 90 持续 300s ⇒ critical（离上限多近）
#   #   log_vl_rows_dropped  >  0  持续 60s  ⇒ warn（已经因保留期在丢日志）
#   max_disk_space_bytes: 107374182400  # 100 GiB；0/不写 = 不限制
#   # max_disk_usage_percent: 85
#
#   # ── 流标签（2026-10-31，对齐 VL 官方接入方式）───────────────────────────
#   # VictoriaLogs 的「流」是**分区键**：同一 stream 内的行共享元数据与索引，
#   # 所以 stream 的基数直接决定 VL 的元数据/内存开销。默认值就是架构裁定的：
#   #   stream_fields: log_source_id,stream     # 总流数上界 ≈ 19 × 3 ≈ 57
#   #
#   # ✅ 入流：log_source_id（19 个，查询最常用）、stream（2-3 个，stdout/stderr）
#   # ❌ 不入流：level（随内容变化 ⇒ 同一源今天全 INFO、明天冒 WARN 就切新分区）
#   # ❌ 绝对禁止：event_id / record_start / record_end / ingest_time_utc / …
#   #     这些字段基数**无界**，每行不同 ⇒ VL 为每行建一个 stream ⇒ 元数据爆炸。
#   #     写进这些字段会在 Load 阶段直接**拒绝启动**（不是告警），因为这一步不可逆：
#   #     stream 元数据只能靠删分区回收。
#   #
#   # 验一下生效没有（写入后执行，看返回的 values 是不是按源/通道分开了）：
#   #   curl -u $USER:$PASS 'http://127.0.0.1:19441/select/logsql/field_values?field=_stream&query=*'
#   # stream_fields: log_source_id,stream
#   #
#   # 关闭流标签（一般**不要**关）：适用于「外部回环 VL 由别的系统一并写入」或
#   # 需要与既有 stream 布局对齐的部署。关掉后写入请求**一个参数都不带**（与本改动前
#   # 字节级一致）。⚠ 注意：同一个 VL 里新旧数据的分区形态会不一致（旧数据全在 "{}" 里）。
#   # disable_stream_fields: false

# Optional persistent Worker/Node or offline FILE_PRIMARY sources. Instance
# sources are registered automatically by CP instance lifecycle RPCs.
#
# log_source_id / storage_namespace 必须用 **node:<节点数字ID>**，不能写字面 node:self——
# CP 一律按 node:<n.ID> 派生联邦查询目标（见 logcoord/assemble.go），写成 node:self 会使
# 查询返回 target_missing_in_worker_response、日志中心空白。节点 ID 见面板「节点」页 URL 或 `GET /api/v1/nodes`。
# log_sources:
#   - log_source_id: node:1
#     source_generation: node-self-v1
#     path: /home/jianmanager/logs/worker.log
#     mode: FILE_PRIMARY
#     archive_glob: /home/jianmanager/logs/worker-*.log.gz
#     source_category: worker
#     storage_namespace: node:1

# 采集归一化的节点级默认时区（缺陷 C）：解释日志行内 [HH:MM:SS] 所用的时区。
# 留空 = UTC（既有行为零变化，未配置的节点时间轴不漂移）；local = 跟随节点进程时区
# （节点 JVM 与 Worker 同机部署时用它对齐本地日志时间）；其余按 IANA 名解析（如 Asia/Hong_Kong）。
# 实例源未显式配置时区时继承本默认；非法值**启动即拒**（时区配错会让整源时间轴静默偏移，
# 不能用回退掩盖）。环境变量覆盖：JIANMANAGER_LOG_INGEST_TIME_ZONE。
#
# ⚠ local 解析的是 **Worker 进程**的本地时区，不是「节点 JVM 的时区」：
#   - 容器（alpine 基础镜像无 /etc/localtime、无 TZ）与部分 systemd 单元（Environment=TZ=）
#     里它会解析成 UTC —— 此时「配了 local」等于什么都没配，表现为新入库条目仍是 +8h；
#   - Worker 启动日志会打印 `采集归一化节点默认时区已生效 config=local resolved=... offsetSeconds=...`，
#     若 local 解析成 UTC 会额外打一条 WARN 提示（含 TZ/ /etc/localtime 的判定依据）。
#   - 生产建议**显式写 IANA 名**（如 Asia/Hong_Kong），跨部署形态都稳定。
# log_ingest:
#   time_zone: local

# 增量对账（log_reconcile.*）已随重建/重放链删除（2026-11-03），相关键不再生效。

# 采集归一化的节点级默认字符集（复审 P2-3）：源未显式配置 Charset 时继承本默认。
# 留空 = auto（合法 UTF-8 原样返回；非法 UTF-8 才按 GB18030 解码并做「含替换字符即放弃」的
# 可靠性判定）；utf-8 / gbk / gb18030 则强制按该字符集解码。
# 中文 locale 的 JVM 与 Worker 同机部署、日志为 GBK 时配 gbk 最稳（显式声明优于启发式判定）。
# 非法值**启动即拒**（回退 auto 会让中文被当作非法 UTF-8 净化成替换字符，正文静默损坏）。
# 环境变量覆盖：JIANMANAGER_LOG_INGEST_CHARSET。
# log_ingest:
#   charset: gbk

# 日志采集器（键 log_tailer.*，对齐 Fluent Bit / Filebeat 三层模型）。
#
# 2026-11-06 起**默认开启**，且它是**唯一**的采集链路（旧 ingest/ledger 链路已删除）。
#
# 采集哪些文件**不在这里配**：路径由 CP 下发的实例登记（绑定表）每轮现算——
# 每个实例的 `<WorkDir>/logs/*.log` 与 `<WorkDir>/proxy.log.*`。这样新建实例的
# 日志无需重启 Worker 就能被采到。
#
# 关闭采集：配 enabled: false（此时不再有任何采集，VL 里只剩存量与保留策略的动作）。
# log_tailer:
#   enabled: true
#   # 额外的采集 glob（通常留空；只用于非实例日志，如节点自身日志）。
#   paths: []
#   # 排除规则；留空 = *.gz,*.lck,*.zip,*.tmp（gz 是归档，明确不采）。
#   exclude: []
#   # 首次发现的文件从哪里读。true = 从头（能补上部署前的历史日志）。
#   read_from_head: true
#   # 位点表路径；留空 = var/log/tailer.registry.jsonl（相对数据根）。
#   # 兄弟文件 <同名>.bindings.json 保存实例绑定，重启后不必等 CP 重新下发。
#   registry_path: ""
#   # 目录扫描 / 读文件周期；留空 = 10s / 2s。
#   scan_interval: ""
#   progress_interval: ""
#   # 多行合并（对齐 Filebeat parsers.multiline 的语义）。**默认启用**。
#   #
#   # 与 Filebeat / Fluent Bit 不同（它们默认关闭），这里默认开是刻意的：本平台的
#   # 采集对象是确定的——MC / BungeeCord，Java 堆栈必然多行。默认关的实测后果：
#   # 88673 行 Bungee 日志里 123 行堆栈续行全被拆成独立事件。
#   #
#   # 默认规则（同时覆盖两种并存的日志形态）：
#   #   pattern: '^\[?[0-9]{2}:[0-9]{2}:[0-9]{2}|^[0-9]{4}-[0-9]{2}-[0-9]{2}'
#   #   negate: true    # 不匹配 = 续行
#   #   match: after    # 续行接到上一行
#   #   max_lines: 500 / timeout: 5s（实现包默认）
#   #
#   # 实测：Bungee 88673 行 → 88550 条事件，最大 42 行堆栈合并成 1 条。
#   # 关闭：配 multiline.disabled: true（留空 pattern 不等于关闭，那是"用默认规则"）。
#   # 自定义：写 pattern/negate/match 覆盖；非法值启动即拒（写错会让日志变乱而非报错）。
#   multiline:
#     disabled: false
#     # pattern: "^\\[?[0-9]{2}:[0-9]{2}:[0-9]{2}"
#     # negate: true
#     # match: after
#     # max_lines: 500
#     # timeout: 5s

# 采集侧采样（log_ingest.sampling.*）已随旧链路删除（2026-11-06）：新采集器逐行写入、无采样实现。
# 旧 worker.yml 里留着这些键不会报错（viper 忽略未知键），但它们**不再有任何效果**。

# 保留策略（成本治理）。**默认不启用**，且默认动作是「搬运到冷层」而**不是删除**。
#
# 硬规则「删前归档」：保留期到期的数据绝不裸删——优先搬运到 COLD（复用既有
# ROUTING_FROZEN→…→CLEANED 状态机，搬运成功且校验通过后才允许 HOT 侧回收）；
# 搬运失败 = **保留原物 + 告警**（宁占盘不丢数据）；无搬运路径且未显式 discard 时
# 同样保留原物并计入 blocked。直接删除需要**两道闸同时打开**（sweep.vl_sweep + discard），
# 且受管 VL 进程还需带 -delete.enable（VL 自身默认关）。
#
# 保留期写法支持 3d/7d/30d/90d（Go 原生语法不认 d/w，这里已补齐）。未列出的级别按
# 推荐值补齐（漏配一档不会退化成永久保留）。级别无法归类的日志按最保守处理：永久保留。
# 热 90 天 / 冷 730 天是**默认口径**（2026-10-02 定稿）：分级档位（debug 3d/info 7d/warn 30d/error 90d）
# 表达的是「**在热层停留多久**」，冷层**所有级别统一**（730d）——即「热的几个月、冷的两年」。
# 触发口径 = 年龄 + 磁盘水位**取先到**（trigger.disk_percent）；搬运失败 = 保留原物 + 告警。
#
# ⚠ log_vl.retention_period 必须**不短于** hot_retention：VL 的 retention 到期是**直接删**，
# 它绕过「删前归档」——若热层实例 retention 比 hot_retention 短，VL 会在搬运之前先删掉数据。
# 启用策略时 Load 在启动受管进程之前拒绝热层/冷层声明长于实际运行时 TTL 的配置。
# 实际回退沿用 supervisor：全局空串为 30d，冷层空白值沿用全局；未启用策略行为不变。
# VL 裸数字和大写 M 表示固定 31 天月，y 为 365 天，小写 m 不能作为月份；不同于产品 TTL。
# 默认 90d/730d 等值兼容，并不表示存在扫描/搬运余量：生产请为扫描与搬运耗时留足额外 TTL。
# 原生有限 TTL 不受平台最后副本/租约闸控制，不能保证无限期搬运失败时仍保留原物。
# log_retention:
#   enabled: true
#   hot_retention: 90d                 # 声明：期望可查的热窗口（默认 90d）
#   cold_retention: 180d               # 声明：期望可查的长期窗口（默认 180d）。
#                                      # ⚠ 不是“冷层保留期”——**没有 COLD 实例**（2026-10-29 已废除）。
#                                      # 它现在唯一的作用是抬高 `log_vl.retention_period` 的下界；
#                                      # 真正执行淘汰的是 VL 自己的 -retentionPeriod。
#   trigger:
#     disk_percent: 0                  # >0 时启用磁盘水位提前搬运（与 log_capacity 同口径读数）
#     min_age: 7d                      # 磁盘触发的最小分区年龄（盘再满也不搬正在写的日分区）
#     sweep_at_hour: 3                 # 每日搬运触发的**本地整点**（默认 3 = 凌晨 3 点；0..23）。
#                                      # 日志按 UTC 日分区、一天只新增一个分区，故按「每天一次」而不是
#                                      # 分钟级周期扫描：其余轮次只会空转。本地时区取进程时区，
#                                      # 东八区 3 点 = UTC 19:00（昨天分区已封口，不与写入抢同一分区）。
#                                      # 写 -1 = 关闭每日调度，回退 trigger.interval 的间隔 ticker（旧行为）。
#     interval: 15m                    # 仅在上面的 -1 兼容档下生效（搬运间隔；默认 15m）
#   discard: false                     # 意图闸：显式允许直接删（默认 false；即使打开，能搬仍优先搬）
#   by_level:                          # 推荐档位（D1）
#     debug: 3d
#     info: 7d
#     warn: 30d
#     error: 90d
#   sources:                           # 来源级覆盖（* 结尾为前缀匹配；显式 0 = 该级别永久保留）
#     - match: "inst:147"
#       by_level:
#         debug: 1d
#   sweep:
#     vl_sweep: false                  # 执行闸（默认 false = 只计算并暴露，不动手）
#     interval: 1h
#     timeout: 30s
#   archive_copy:                      # 次选路径（默认关）：搬不了冷层时导出为**独立副本**
#                                      # 语义：冻结快照 → 逐文件 gzip → 写 manifest(sha256/字节数/
#                                      # coverage) → 逐文件回读校验。导出成功且校验通过**才**谈回收热层。
#                                      # ⚠ 回收热层与 discard 走**同一套三闸**（discard + sweep.vl_sweep +
#                                      # log_vl.delete_enabled）；三闸未全开时是「副本与原物并存」，
#                                      # 不是「只有副本」。这是有意的：多留一份盘 ≪ 少一份数据。
#     enabled: false                   # 默认 false：它会把数据写到另一个目的地，必须显式授权
#     provider: local                  # local（默认）| s3 | minio。
#                                      # 为什么允许 s3/minio：导出归档的价值在「另存一份」——若目的地只能
#                                      # 与热层同机同盘，单盘故障/整机报废时副本跟着没，「删前归档」只剩
#                                      # 「省空间」而丢了「保一份」。复用已在真机 RustFS 验过的
#                                      # SigV4 客户端，不新造协议也不新造凭证模型。
#     root: /var/lib/jianmanager/log-archive
#                                      # [provider=local] 归档根目录（启用且 provider=local 时必填，
#                                      # 为空则**启动即拒**）。
#                                      # 布局由 archive 包固定：<root>/<namespace>/<utc_day>/g<gen>/
#                                      # 其中 manifest.json 与 raw/files/<源相对路径>.gz 构成一份完整副本。
#                                      # 请放在**独立于热层与冷层的盘**上，否则省不下空间也保不了险。
#     endpoint: s3.example.com:9000    # [provider=s3|minio] 必填（不带 scheme，scheme 由 use_ssl 决定）
#     bucket: jm-log-archive           # [provider=s3|minio] 必填；省略或留空则**启动即拒**
#     region: us-east-1                # [provider=s3|minio] SigV4 区域
#     prefix: logs/retention           # [provider=s3|minio] 对象键前缀；前缀之后仍是 <ns>/<day>/g<gen>/
#     access_key: ${JM_ARCHIVE_AK}     # 凭证只写 ${ENV} 引用，不写明文（见 .claude/rules/config-files.md）
#     secret_key: ${JM_ARCHIVE_SK}
#     use_ssl: true                    # 默认 false
#                                      # 目的地不完整（local 无 root / s3|minio 无 endpoint 或 bucket /
#                                      # provider 写错）一律启动即拒：静默按「未启用」处理会让运维以为
#                                      # 归档在跑，而到期数据继续占着热层直到盘满。