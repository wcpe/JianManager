# JS 工作区（FR-283，见 ADR-064）：apps/* 可运行外壳 + packages/* 第一方 JS 库。
# pnpm 只认带 package.json 的目录，Go 外壳（apps/control-plane 等）自动被忽略。
# bot-worker 显式排除（FR-286 移入 apps/ 后仍 npm 自管：生产随 Worker 部署自带 node_modules）。
packages:
  - "apps/*"
  - "packages/*"
  - "!apps/bot-worker"
  # jm 的 npm 分发壳（FR-567）：独立于主仓 JS 工作区自管，发布产物由
  # `make dist-jm-npm` 填充后再 `npm publish`。若纳入 workspace，pnpm 会试图
  # 安装它并把它当本地包链接，而它实际上是「一次构建、按平台分包发布」的发布清单。
  - "!packages/jm-npm"
